<script>
const SISTEMA_VERSAO='V26.5.8B';

/* ===== V26.5.5B - Experiência do Usuário: Notificações discretas ===== */
function garantirToastContainer(){
    let c=document.getElementById('toastContainer');
    if(!c){c=document.createElement('div');c.id='toastContainer';c.className='toast-container';document.body.appendChild(c);}
    return c;
}
function classificarToast(msg,tipo){
    if(tipo)return tipo;
    const t=String(msg||'').toLowerCase();
    if(t.includes('sucesso')||t.includes('salvo')||t.includes('registrad')||t.includes('restaurado')||t.includes('realizado'))return 'sucesso';
    if(t.includes('erro')||t.includes('inválido')||t.includes('insuficiente')||t.includes('não pode')||t.includes('não é possível')||t.includes('inexistente'))return 'erro';
    if(t.includes('atenção')||t.includes('informe')||t.includes('preencha')||t.includes('selecione')||t.includes('cancelad')||t.includes('pendente'))return 'aviso';
    return 'info';
}
function mostrarToast(msg,tipo='info',tempo=3600){
    const c=garantirToastContainer();
    const el=document.createElement('div');
    const classe=classificarToast(msg,tipo);
    const icone=classe==='sucesso'?'✅':classe==='erro'?'❌':classe==='aviso'?'⚠️':'ℹ️';
    el.className='toast-msg '+classe;
    el.innerHTML=`${icone} ${escapeHtml(String(msg||''))}`;
    c.appendChild(el);
    setTimeout(()=>{el.classList.add('saindo');setTimeout(()=>el.remove(),260)},tempo);
    return el;
}
(function configurarFeedbackUsuario(){
    const alertaNativo=window.alert;
    window.alert=function(msg){mostrarToast(msg);};
    window.alertaNativo=alertaNativo;
    document.addEventListener('click',function(e){
        const btn=e.target.closest('button');
        if(!btn||btn.disabled)return;
        const txt=(btn.textContent||'').toLowerCase();
        const acao=/salvar|registrar|importar|restaurar|backup|pagar|reabrir/.test(txt);
        if(acao){
            btn.classList.add('feedback-processando');
            btn.dataset.textoOriginal=btn.textContent;
            setTimeout(()=>btn.classList.remove('feedback-processando'),700);
        }

const VERSAO_REGISTRO_AUDITORIA='2.0';
function agoraISO(){return new Date().toISOString()}
function registroAtivo(reg){return !reg || !reg.statusRegistro || reg.statusRegistro==='ATIVO'}
function registroCancelado(reg){return reg && reg.statusRegistro==='CANCELADO'}
function prepararAuditoriaRegistro(reg){
    if(!reg)return reg;
    if(!reg.statusRegistro)reg.statusRegistro='ATIVO';
    if(!reg.criadoEm)reg.criadoEm=reg.dataLancamento||reg.dataCriacao||reg.data||agoraISO();
    if(!reg.alteradoEm)reg.alteradoEm=reg.criadoEm;
    if(reg.canceladoEm===undefined)reg.canceladoEm=null;
    if(reg.canceladoPor===undefined)reg.canceladoPor='';
    if(reg.motivoCancelamento===undefined)reg.motivoCancelamento='';
    if(!reg.versaoRegistro)reg.versaoRegistro=VERSAO_REGISTRO_AUDITORIA;
    return reg;
}
function aplicarAuditoriaSalvar(novo,atual){
    prepararAuditoriaRegistro(novo);
    if(atual){
        novo.criadoEm=atual.criadoEm||novo.criadoEm||agoraISO();
        novo.statusRegistro=atual.statusRegistro||novo.statusRegistro||'ATIVO';
        novo.canceladoEm=atual.canceladoEm||null;
        novo.canceladoPor=atual.canceladoPor||'';
        novo.motivoCancelamento=atual.motivoCancelamento||'';
    }
    novo.alteradoEm=agoraISO();
    novo.versaoRegistro=VERSAO_REGISTRO_AUDITORIA;
    return novo;
}

    ['producao','vendas','despesas','cooperados','frequencia','ocorrenciasSaude'].forEach(mod=>{
        if(Array.isArray(db[mod]))db[mod].forEach(prepararAuditoriaRegistro);
    });
    if(Array.isArray(db.despesas))db.despesas.forEach(d=>{
        if(d.excluida && d.statusRegistro!=='CANCELADO'){
            d.statusRegistro='CANCELADO';
            d.canceladoEm=d.dataExclusao||d.canceladoEm||agoraISO();
            d.canceladoPor=d.canceladoPor||'Não informado';
            d.motivoCancelamento=d.motivoCancelamento||d.motivoExclusao||'Exclusão lógica anterior à V26.5.0';

}

    if(modulo==='producao')return `Produção\nData: ${formatarDataBR(reg.data)}\nMaterial: ${reg.material}\nQuantidade: ${num(reg.quantidade)} ${reg.unidade||'kg'}`;

function cancelarRegistro(modulo,id,callback){
    const lista=db[modulo]||[];
    const reg=lista.find(x=>String(x.id)===String(id));
    if(!reg)return alert('Registro não encontrado.');
    if(registroCancelado(reg))return alert('Este registro já está cancelado.');
    const resumo=resumoCancelamento(modulo,reg);
    let responsavel=prompt(`${resumo}\n\nInforme quem está cancelando este registro:`);
    if(responsavel===null)return;
    responsavel=String(responsavel).trim();
    if(!responsavel)return alert('Informe o responsável pelo cancelamento.');
    let motivo=prompt(`${resumo}\n\nInforme o motivo do cancelamento:`);
    if(motivo===null)return;
    motivo=String(motivo).trim();
    if(!motivo)return alert('Informe o motivo do cancelamento.');
    if(!confirm(`${resumo}\n\nConfirmar cancelamento?\n\nResponsável: ${responsavel}\nMotivo: ${motivo}\n\nO registro continuará salvo para auditoria.`))return;
    prepararAuditoriaRegistro(reg);
    reg.statusRegistro='CANCELADO';
    reg.canceladoEm=agoraISO();
    reg.canceladoPor=responsavel;
    reg.motivoCancelamento=motivo;
    reg.alteradoEm=reg.canceladoEm;
    reg.versaoRegistro=VERSAO_REGISTRO_AUDITORIA;
    if(modulo==='cooperados'){
        reg.ativo='Não';
        if(!reg.situacaoAntesCancelamento)reg.situacaoAntesCancelamento=reg.situacaoOperacional||'';

    }

    if(typeof callback==='function')callback(); else renderAtual();
}

function calcularStatusDespesa(d){if(d&&d.excluida)return 'Excluída'; if(d.dataPagamento)return 'Pago'; let venc=getDate(d.dataVencimento); let hoje=getDate(hojeISO()); if(venc&&venc<hoje)return 'Vencido'; return 'A Vencer';}

function calcularEstoque(){let map=new Map(); db.producao.forEach(p=>{if(p.tipo==='Rejeito')return; let e=map.get(p.material)||{produzido:0,vendido:0}; e.produzido+=Number(p.quantidade)||0; map.set(p.material,e)}); db.vendas.forEach(v=>{let e=map.get(v.material)||{produzido:0,vendido:0}; e.vendido+=Number(v.quantidade)||0; map.set(v.material,e)}); return [...map.entries()].map(([material,e])=>({material,produzido:e.produzido,vendido:e.vendido,saldo:e.produzido-e.vendido})).sort((a,b)=>a.material.localeCompare(b.material));}
function resumoProducao(lista){let total=lista.filter(p=>p.tipo!=='Rejeito').reduce((a,p)=>a+(Number(p.quantidade)||0),0); let rejeito=lista.filter(p=>p.tipo==='Rejeito').reduce((a,p)=>a+(Number(p.quantidade)||0),0); let processado=lista.filter(p=>p.tipo==='Processado').reduce((a,p)=>a+(Number(p.quantidade)||0),0); let bruto=lista.filter(p=>p.tipo==='Bruto').reduce((a,p)=>a+(Number(p.quantidade)||0),0); let eficiencia=(total+rejeito)>0?total/(total+rejeito)*100:0; let porCategoria={},porMaterial={}; lista.forEach(p=>{if(p.tipo==='Rejeito')return; porCategoria[p.categoria]=(porCategoria[p.categoria]||0)+(Number(p.quantidade)||0); porMaterial[p.material]=(porMaterial[p.material]||0)+(Number(p.quantidade)||0)}); let topCat=Object.entries(porCategoria).sort((a,b)=>b[1]-a[1])[0]; let topMat=Object.entries(porMaterial).sort((a,b)=>b[1]-a[1])[0]; return {total,rejeito,processado,bruto,eficiencia,porCategoria,porMaterial,topCat,topMat};}
function renderDashboard(){document.getElementById('dynamic-view').innerHTML=`<div class="card-panel"><div class="section-title"><h2>📊 Painel Gerencial</h2><span class="muted">Visão mensal consolidada</span></div><div class="filter-bar"><div class="filter-field"><label>Mês</label><select id="dashMes">${optMes('',true)}</select></div><div class="filter-field"><label>Ano</label><select id="dashAno">${optAno()}</select></div><button id="btnDash" class="info">Atualizar</button></div><div id="dashContent"></div></div>`; document.getElementById('btnDash').onclick=carregarDashDados; carregarDashDados();}
function carregarDashDados(){
    let mes=document.getElementById('dashMes').value,ano=document.getElementById('dashAno').value;
    let vendas=db.vendas.filter(v=>mesmoMesAno(v.data,mes,ano));
    let vendasAno=db.vendas.filter(v=>mesmoMesAno(v.data,'',ano));
    let producao=db.producao.filter(p=>mesmoMesAno(p.data,mes,ano));
    let producaoAno=db.producao.filter(p=>mesmoMesAno(p.data,'',ano));
    let despesas=db.despesas.filter(d=>despesaEstaAtiva(d)).filter(d=>{let dataBase=d.situacao==='Pago'&&d.dataPagamento?d.dataPagamento:(d.dataVencimento||d.dataLancamento||d.data); return mesmoMesAno(dataBase,mes,ano)});
    let despPagas=despesas.filter(d=>d.situacao==='Pago');
    let vencidas=despesas.filter(d=>calcularStatusDespesa(d)==='Vencido');
    let faturamento=vendas.reduce((a,v)=>a+(Number(v.total)||0),0);
    let custos=despPagas.reduce((a,d)=>a+(Number(d.valor)||0),0);
    let lucro=faturamento-custos;
    let margem=faturamento?lucro/faturamento*100:0;
    let rp=resumoProducao(producao);
    let rpAno=resumoProducao(producaoAno);
    let coopAtivos=db.cooperados.filter(c=>c.ativo==='Sim'&&c.situacaoOperacional==='Ativo').length;
    let produtividade=coopAtivos?rp.total/coopAtivos:0;
    let volumeVendido=vendas.reduce((a,v)=>a+(Number(v.quantidade)||0),0);
    let precoMedio=volumeVendido?faturamento/volumeVendido:0;
    let prodAno=mapaProducaoPorMaterial(producaoAno);
    let vendaValorAno=mapaVendasValor(vendasAno);
    let alertas=gerarAlertasDashboard({mes,ano,rp,vencidas});
    document.getElementById('dashContent').innerHTML=`
        <div class="dashboard-cards">
            <div class="card"><div>💰 Faturamento</div><div class="card-value">${moeda(faturamento)}</div></div>

            <div class="card"><div>📈 Resultado</div><div class="card-value">${moeda(lucro)}</div></div>
            <div class="card"><div>📊 Margem</div><div class="card-value">${num(margem,1)}%</div></div>
            <div class="card"><div>⚙️ Produção válida</div><div class="card-value">${num(rp.total)} kg</div></div>
            <div class="card"><div>🧹 Rejeito</div><div class="card-value">${num(rp.rejeito)} kg</div></div>
            <div class="card"><div>🔍 Eficiência triagem</div><div class="card-value">${num(rp.eficiencia,1)}%</div></div>
            <div class="card"><div>👥 Produtividade</div><div class="card-value">${num(produtividade)} kg/coop</div></div>
            <div class="card"><div>🏷️ Preço médio</div><div class="card-value">${moeda(precoMedio)}/kg</div></div>
            <div class="card"><div>⚠️ Despesas vencidas</div><div class="card-value">${vencidas.length}</div></div>
        </div>
        <div class="grid-3">
            <div class="card-panel"><h3>📊 Top 5 Produção no Ano</h3>${graficoBarras(prodAno,'kg',5)}</div>
            <div class="card-panel"><h3>💰 Top 5 Vendas no Ano</h3>${graficoBarras(vendaValorAno,'R$',5)}</div>
            <div class="card-panel"><h3>📂 Produção por Categoria</h3>${graficoBarras(rp.porCategoria,'kg',5)}</div>
        </div>
        <div class="grid-2">
            <div class="card-panel"><h3>📈 Evolução Mensal da Produção</h3>${graficoBarras(mapaProducaoMensal(producaoAno),'kg',12)}</div>
            <div class="card-panel" style="border-left:7px solid ${alertas.cor};border-top:5px solid #d4af37"><h3>🚨 Alertas Gerenciais</h3>${alertas.html}</div>
        </div>`;
}
function gerarAlertasDashboard(ctx){
    let mes=ctx.mes, ano=ctx.ano, rp=ctx.rp, vencidas=ctx.vencidas;
    let itens=[], nivel='good';
    function add(tipo,msg){itens.push({tipo,msg}); if(tipo==='danger')nivel='danger'; else if(tipo==='warning'&&nivel!=='danger')nivel='warning';}
    if(vencidas.length>0)add('danger',`Existem ${vencidas.length} despesa(s) vencida(s).`);
    let metaRejeito=typeof metaValor==='function'?Number(metaValor('rejeito')||0):0;
    if(metaRejeito>0 && rp.rejeito>metaRejeito)add('danger',`Rejeito acima da meta definida (${num(rp.rejeito)} kg de ${num(metaRejeito)} kg).`);
    else if(!metaRejeito && (rp.total+rp.rejeito)>0 && (rp.rejeito/(rp.total+rp.rejeito)*100)>15)add('warning',`Rejeito acima de 15% do volume processado no período.`);
    let freq=typeof freqMedia==='function'?freqMedia(mes,ano):0;
    if(freq>0 && freq<85)add('warning',`Frequência média abaixo de 85% (${num(freq,1)}%).`);
    let abertas=(db.ocorrenciasSaude||[]).filter(o=>String(o.status||'')!=='Encerrada').length;
    if(abertas>0)add('danger',`Existem ${abertas} ocorrência(s) de saúde/segurança em aberto.`);
    let limite=new Date(); limite.setDate(limite.getDate()-90);
    let estoqueParado=calcularEstoque().filter(e=>e.saldo>0).filter(e=>{
        let vendasMaterial=(db.vendas||[]).filter(v=>v.material===e.material&&v.data).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
        if(!vendasMaterial.length)return true;
        let ultima=getDate(vendasMaterial[0].data);
        return ultima && ultima<limite;
    }).length;
    if(estoqueParado>0)add('warning',`Existem ${estoqueParado} material(is) com estoque disponível sem venda recente.`);
    if(!itens.length){itens.push({tipo:'good',msg:'Nenhum alerta crítico identificado.'});}
    let cor=nivel==='danger'?'#b91c1c':nivel==='warning'?'#d4af37':'#008037';
    let html=`<div class="bar-list">${itens.map(i=>{let icon=i.tipo==='danger'?'🔴':i.tipo==='warning'?'🟡':'🟢';return `<div style="padding:.55rem .7rem;border-radius:14px;background:#f8fbfd;border:1px solid #e1e7ee;font-weight:700;color:#263238">${icon} ${escapeHtml(i.msg)}</div>`}).join('')}</div>`;
    return {cor,html};
}
function listaResumo(obj,tipo='kg',lim=99){let arr=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,lim); if(!arr.length)return '<div class="empty">Sem dados no período.</div>'; return `<ul>${arr.map(([k,v])=>`<li><strong>${escapeHtml(k)}:</strong> ${tipo==='R$'?moeda(v):num(v)+' kg'}</li>`).join('')}</ul>`}
function graficoBarras(obj,tipo='kg',lim=5){let arr=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,lim); if(!arr.length)return '<div class="empty">Sem dados para gráfico.</div>'; let max=Math.max(...arr.map(x=>Number(x[1])||0),1); return `<div class="bar-list">${arr.map(([k,v])=>`<div class="bar-item"><div><strong>${escapeHtml(k)}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(Number(v)||0)/max*100)}%"></div></div><div>${tipo==='R$'?moeda(v):num(v)+' kg'}</div></div>`).join('')}</div>`}
function mapaProducaoPorMaterial(lista){let obj={}; lista.forEach(p=>{if(p.tipo==='Rejeito')return; obj[p.material]=(obj[p.material]||0)+(Number(p.quantidade)||0)}); return obj}
function mapaProducaoMensal(lista){let obj={}; for(let i=1;i<=12;i++){obj[mesNome(i).slice(0,3)]=0} lista.forEach(p=>{if(p.tipo==='Rejeito')return; let d=getDate(p.data); if(!d)return; let chave=mesNome(d.getMonth()+1).slice(0,3); obj[chave]=(obj[chave]||0)+(Number(p.quantidade)||0)}); return obj}
function mapaVendasValor(lista){let obj={}; lista.forEach(v=>obj[v.material]=(obj[v.material]||0)+(Number(v.total)||0)); return obj}
function mapaVendasVolume(lista){let obj={}; lista.forEach(v=>obj[v.material]=(obj[v.material]||0)+(Number(v.quantidade)||0)); return obj}

function renderProducao(){let html=`<div class="card-panel"><h2>${editProducaoId?'✏️ Editar Produção':'➕ Nova Produção'}</h2><div class="notice"><strong>Lançamento simplificado:</strong> selecione o material e o sistema preencherá automaticamente categoria, unidade e tipo.</div><div class="form-grid"><div class="field"><label for="prodData">Data da produção</label><input type="date" id="prodData"></div><div class="field"><label for="prodMaterial">Material produzido</label><select id="prodMaterial">${optMateriaisAgrupados('')}</select></div><div class="field"><label for="prodCategoria">Categoria automática</label><input type="text" id="prodCategoria" readonly></div><div class="field"><label for="prodUnidade">Unidade automática</label><input type="text" id="prodUnidade" readonly></div><div class="field"><label for="prodTipo">Tipo automático</label><input type="text" id="prodTipo" readonly></div><div class="field"><label for="prodQuantidade">Quantidade produzida</label><input type="number" id="prodQuantidade" placeholder="Informe a quantidade"></div><div class="field"><label for="prodCatadores">Equipe operacional</label><input type="number" id="prodCatadores" placeholder="Quantidade de pessoas"></div><div class="field"><label for="prodObs">Observações</label><textarea id="prodObs" placeholder="Informações complementares"></textarea></div></div><div class="btn-row"><button id="salvarProducao">${editProducaoId?'Atualizar Produção':'Salvar Produção'}</button><button id="cancelarProd" class="secondary" style="display:${editProducaoId?'inline-block':'none'}">Cancelar</button></div></div><div class="card-panel"><h3>🔎 Filtros e Indicadores de Produção</h3><div class="filter-bar"><div class="filter-field"><label>Mês</label><select id="fProdMes">${optMes('',true)}</select></div><div class="filter-field"><label>Ano</label><select id="fProdAno">${optAno()}</select></div><div class="filter-field"><label>Categoria</label><select id="fProdCategoria">${optCategorias()}</select></div><div class="filter-field"><label>Pesquisar material</label><input type="text" id="fProdBuscaMaterial" placeholder="Pesquisar"></div><div class="filter-field"><label>Material</label><select id="fProdMaterial">${optMateriais()}</select></div><div class="filter-field"><label>Tipo</label><select id="fProdTipo"><option value="">Todos os tipos</option><option>Bruto</option><option>Processado</option><option>Rejeito</option></select></div><button id="btnFiltrarProd" class="info">Filtrar</button><button id="btnLimparProd" class="secondary">Limpar</button></div><div id="indicadoresProducao"></div><div id="listaProducao"></div></div>`; document.getElementById('dynamic-view').innerHTML=html; document.getElementById('salvarProducao').onclick=salvarProducao; document.getElementById('cancelarProd').onclick=()=>{editProducaoId=null;renderProducao()}; document.getElementById('prodMaterial').onchange=()=>preencherMaterialProd(); document.getElementById('fProdBuscaMaterial').oninput=()=>atualizarListaMaterial('fProdMaterial','fProdBuscaMaterial',true); document.getElementById('btnFiltrarProd').onclick=listarProducoes; document.getElementById('btnLimparProd').onclick=()=>renderProducao(); preencherMaterialProd(); if(editProducaoId)popularFormProducao(editProducaoId); listarProducoes();}
function preencherMaterialProd(){let mat=db.materiais.find(m=>m.nome===document.getElementById('prodMaterial').value); if(mat){document.getElementById('prodCategoria').value=mat.categoria; document.getElementById('prodUnidade').value=mat.unidade||'kg'; if(mat.tipoPadrao)document.getElementById('prodTipo').value=mat.tipoPadrao;}}
function salvarProducao(){let data=prodData.value,material=prodMaterial.value,categoria=prodCategoria.value,unidade=prodUnidade.value||'kg',tipo=prodTipo.value,quantidade=Number(prodQuantidade.value),catadores=Number(prodCatadores.value)||0,observacoes=prodObs.value; if(!data||!material||!quantidade||quantidade<=0)return alert('Preencha data, material e quantidade.'); let item={id:editProducaoId||Date.now(),data,material,categoria,unidade,tipo,quantidade,catadores,produtividade:catadores?quantidade/catadores:0,observacoes}; if(editProducaoId){let i=db.producao.findIndex(p=>p.id===editProducaoId); if(i>=0)db.producao[i]=item; editProducaoId=null}else db.producao.push(item); salvarDB(); renderProducao();}
function popularFormProducao(id){let p=db.producao.find(x=>x.id===id); if(!p)return; prodData.value=p.data; prodMaterial.value=p.material; prodCategoria.value=p.categoria; prodUnidade.value=p.unidade; prodTipo.value=p.tipo; prodQuantidade.value=p.quantidade; prodCatadores.value=p.catadores||''; prodObs.value=p.observacoes||'';}
function filtrarProducao(){let mes=fProdMes.value,ano=fProdAno.value,cat=fProdCategoria.value,mat=fProdMaterial.value,tipo=fProdTipo.value; return db.producao.filter(p=>mesmoMesAno(p.data,mes,ano)&&(!cat||p.categoria===cat)&&(!mat||p.material===mat)&&(!tipo||p.tipo===tipo));}
function listarProducoes(){let lista=filtrarProducao(); let r=resumoProducao(lista); indicadoresProducao.innerHTML=`<div class="dashboard-cards"><div class="card"><div>Total válido</div><div class="card-value">${num(r.total)} kg</div></div><div class="card"><div>Processado</div><div class="card-value">${num(r.processado)} kg</div></div><div class="card"><div>Bruto</div><div class="card-value">${num(r.bruto)} kg</div></div><div class="card"><div>Rejeito</div><div class="card-value">${num(r.rejeito)} kg</div></div><div class="card"><div>Eficiência</div><div class="card-value">${num(r.eficiencia,1)}%</div></div><div class="card"><div>Maior categoria</div><div class="card-value">${r.topCat?escapeHtml(r.topCat[0]):'-'}</div><small>${r.topCat?num(r.topCat[1])+' kg':''}</small></div></div><div class="grid-2"><div class="card-panel"><h3>Produção por categoria</h3>${listaResumo(r.porCategoria)}</div><div class="card-panel"><h3>Produção por material</h3>${listaResumo(r.porMaterial,'kg',10)}</div></div>`; listaProducao.innerHTML=`<div class="table-wrap"><table><tr><th>Data</th><th>Material</th><th>Categoria</th><th>Tipo</th><th>Qtd</th><th>Catadores</th><th>Produtividade</th><th>Ações</th></tr>${lista.map(p=>`<tr><td>${formatarDataBR(p.data)}</td><td>${escapeHtml(p.material)}</td><td>${escapeHtml(p.categoria)}</td><td>${p.tipo}</td><td>${num(p.quantidade)} ${p.unidade||'kg'}</td><td>${p.catadores||'-'}</td><td>${num(p.produtividade,2)}</td><td><button class="mini-btn info" onclick="editarProducao(${p.id})">✏️ Editar</button> <button class="mini-btn danger" onclick="excluirProducao(${p.id})">🗑️ Excluir</button></td></tr>`).join('')||'<tr><td colspan="8">Sem lançamentos.</td></tr>'}</table></div>`;}

function renderVendas(){let html=`<div class="card-panel"><h2>${editVendaId?'✏️ Editar Venda':'💰 Registrar Venda'}</h2><div class="notice"><strong>Venda simplificada:</strong> escolha o material vendido em blocos por categoria, no mesmo padrão do módulo Produção. A categoria, unidade e tipo são preenchidos automaticamente.</div><div class="form-grid"><div class="field"><label for="vendaData">Data da venda</label><input type="date" id="vendaData"></div><div class="field"><label for="vendaMaterial">Material vendido</label><select id="vendaMaterial">${optMateriaisAgrupados('')}</select></div><div class="field"><label for="vendaCategoria">Categoria automática</label><input type="text" id="vendaCategoria" readonly></div><div class="field"><label for="vendaTipo">Tipo automático</label><input type="text" id="vendaTipo" readonly></div><div class="field"><label for="vendaUnidade">Unidade automática</label><input type="text" id="vendaUnidade" readonly></div><div class="field"><label for="vendaQuantidade">Quantidade vendida</label><input type="number" id="vendaQuantidade" placeholder="Informe a quantidade"></div><div class="field"><label for="vendaPrecoUnit">Preço unitário</label><input type="number" id="vendaPrecoUnit" placeholder="R$ por kg"></div><div class="field"><label for="vendaComprador">Comprador</label><input type="text" id="vendaComprador" placeholder="Nome do comprador"></div><div class="field"><label for="vendaObs">Observações</label><textarea id="vendaObs" placeholder="Informações complementares"></textarea></div></div><div class="btn-row"><button id="salvarVenda">${editVendaId?'Atualizar Venda':'Salvar Venda'}</button><button id="cancelarVenda" class="secondary" style="display:${editVendaId?'inline-block':'none'}">Cancelar</button></div></div><div class="card-panel"><h3>Vendas Realizadas</h3><div class="filter-bar"><div class="filter-field"><label>Mês</label><select id="fVendaMes">${optMes('',true)}</select></div><div class="filter-field"><label>Ano</label><select id="fVendaAno">${optAno()}</select></div><div class="filter-field"><label>Categoria</label><select id="fVendaCategoria">${optCategorias()}</select></div><div class="filter-field"><label>Material</label><select id="fVendaMaterial"><option value="">Todos</option>${optMateriaisAgrupados('')}</select></div><button id="btnVendaFiltro" class="info">Filtrar</button></div><div id="listaVendas"></div></div>`; dynamicView().innerHTML=html; salvarVenda.onclick=salvarVendaFn; cancelarVenda.onclick=()=>{editVendaId=null;renderVendas()}; btnVendaFiltro.onclick=listarVendas; vendaMaterial.onchange=preencherInfoVenda; preencherInfoVenda(); if(editVendaId)popularFormVenda(editVendaId); listarVendas();}

function sugerirCategoria(descricao){
    const texto=String(descricao||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    if(!texto.trim())return '';
    const regras=[
        {categoria:'Operacional',palavras:['energia','luz','agua','telefone','internet','aluguel','galpao','sede','combustivel','gasolina','diesel','manutencao','conserto','reparo','oficina','peca','pneu','caminhao','prensa','esteira','balanca','equipamento','epi','luva','bota','mascara','saco','bag']},
        {categoria:'Administrativo',palavras:['contador','contabilidade','advogado','juridico','taxa','documento','cartorio','registro','licenca','papel','caneta','impressao','toner','escritorio','banco','tarifa','boleto','juros']},
        {categoria:'Pessoal',palavras:['salario','funcionario','motorista','auxiliar','fgts','inss','vale-transporte','vale transporte','rateio','cooperado','distribuicao','sobra']},
        {categoria:'Impostos e Taxas',palavras:['imposto','iss','ir','contribuicao']}
    ];
    for(const regra of regras){
        if(regra.palavras.some(p=>texto.includes(p)))return regra.categoria;
    }
    return '';
}
function configurarSugestaoCategoriaDespesa(){
    const campo=document.getElementById('despTipo');
    const select=document.getElementById('despCategoria');
    const feedback=document.getElementById('despCategoriaFeedback');
    if(!campo||!select)return;
    function aplicarSugestao(){
        const categoria=sugerirCategoria(campo.value);
        if(categoria){
            select.value=categoria;
            if(feedback){feedback.textContent='✅ Categoria sugerida automaticamente: '+categoria; feedback.classList.add('show');}
        }else if(feedback){
            feedback.textContent='';
            feedback.classList.remove('show');
        }
    }
    campo.addEventListener('input',aplicarSugestao);
    campo.addEventListener('change',aplicarSugestao);
    select.addEventListener('change',()=>{if(feedback){feedback.textContent='';feedback.classList.remove('show');}});
}


const coresCategoriasDespesas={
    'Operacional':'#1f4e79',
    'Administrativo':'#008037',
    'Pessoal':'#d98c00',
    'Impostos e Taxas':'#7b2cbf',
    'Manutenção':'#d4af37',
    'Outros':'#b91c1c'
};
function resumoDespesasPorCategoria(lista){
    const ordem=['Operacional','Administrativo','Pessoal','Impostos e Taxas','Manutenção','Outros'];
    const mapa={};
    lista.forEach(d=>{
        const cat=d.categoriaDesp||'Outros';
        mapa[cat]=(mapa[cat]||0)+(Number(d.valor)||0);
    });
    return ordem.map(cat=>({categoria:cat,valor:mapa[cat]||0})).filter(x=>x.valor>0)
        .concat(Object.keys(mapa).filter(cat=>!ordem.includes(cat)).map(cat=>({categoria:cat,valor:mapa[cat]})).filter(x=>x.valor>0));
}
function graficoPizzaDespesas(lista,total){
    const dados=resumoDespesasPorCategoria(lista);
    if(!dados.length||!total)return `<div class="empty">Sem despesas para montar o gráfico por categoria.</div>`;
    let inicio=0;
    const fatias=dados.map(item=>{
        const perc=(Number(item.valor)||0)/total*100;
        const fim=inicio+perc;
        const cor=coresCategoriasDespesas[item.categoria]||'#6c757d';
        const trecho=`${cor} ${inicio.toFixed(2)}% ${fim.toFixed(2)}%`;
        inicio=fim;
        return trecho;
    }).join(', ');
    const legenda=dados.map(item=>{
        const perc=total?item.valor/total*100:0;
        const cor=coresCategoriasDespesas[item.categoria]||'#6c757d';
        return `<div class="categoria-legenda-item"><span class="categoria-cor" style="background:${cor}"></span><div><div class="categoria-nome">${escapeHtml(item.categoria)}</div><span class="categoria-percentual">${num(perc,1)}% do total filtrado</span></div><div class="categoria-valor">${moeda(item.valor)}</div></div>`;
    }).join('');
    return `<div class="despesas-analise-grid"><div class="despesas-chart-card"><div class="despesas-chart-head"><div><div class="despesas-chart-title">🍕 Despesas por Categoria</div><div class="despesas-chart-sub">Distribuição percentual no período filtrado</div></div></div><div class="pizza-despesas-wrap"><div class="pizza-despesas" style="background:conic-gradient(${fatias})"><div class="pizza-despesas-total"><small>Total</small>${moeda(total)}</div></div></div></div><div class="despesas-chart-card"><div class="despesas-chart-head"><div><div class="despesas-chart-title">📌 Resumo por Categoria</div><div class="despesas-chart-sub">Valor e participação de cada grupo de despesa</div></div></div><div class="categoria-legenda">${legenda}</div></div></div>`;
}

function renderIndicadorPreco(){dynamicView().innerHTML=`<div class="card-panel"><div class="section-title"><h2>📈 Indicador de Preço Médio</h2><span class="muted">Gestão à vista do preço por material vendido</span></div><div class="notice"><strong>Leitura gerencial:</strong> acompanhe volume vendido, faturamento, preço médio do mês e comparação com o preço médio anual. Materiais sem venda podem ser ocultados para facilitar a análise.</div><div class="filter-bar"><div class="filter-field"><label>Mês/Ano</label><input type="month" id="mesAnoFiltro" value="${anoAtual()}-${String(mesAtual()).padStart(2,'0')}"></div><div class="filter-field"><label>Material</label><select id="fPrecoMaterial">${optMateriais('',true)}</select></div><div class="filter-field"><label>Categoria</label><select id="fPrecoCategoria">${optCategorias()}</select></div><div class="filter-field"><label>Situação</label><select id="fPrecoSituacao"><option value="">Todas</option><option>Ganho</option><option>Perda</option><option>Neutro</option></select></div><label class="switch-line"><input type="checkbox" id="fPrecoOcultarZero" checked> Ocultar sem venda</label><button id="calcPreco" class="info">Atualizar</button></div><div id="precoResumo"></div><div id="precoTable"></div></div>`; calcPreco.onclick=calcularPreco; fPrecoMaterial.onchange=calcularPreco; fPrecoCategoria.onchange=()=>{filtrarMateriaisPrecoPorCategoria();calcularPreco()}; fPrecoSituacao.onchange=calcularPreco; fPrecoOcultarZero.onchange=calcularPreco; filtrarMateriaisPrecoPorCategoria(); calcularPreco();}
function filtrarMateriaisPrecoPorCategoria(){let cat=fPrecoCategoria?.value||''; let atual=fPrecoMaterial?.value||''; let lista=db.materiais.filter(m=>!cat||m.categoria===cat); fPrecoMaterial.innerHTML='<option value="">Todos</option>'+lista.map(m=>`<option value="${escapeHtml(m.nome)}" ${atual===m.nome?'selected':''}>${escapeHtml(m.nome)}</option>`).join(''); if(atual && !lista.some(m=>m.nome===atual)) fPrecoMaterial.value='';}
function calcularPreco(){let [ano,mes]=mesAnoFiltro.value.split('-'); let matFiltro=fPrecoMaterial.value||'',cat=fPrecoCategoria.value||'',sitFiltro=fPrecoSituacao.value||'',ocultarZero=fPrecoOcultarZero.checked; let vendas=db.vendas.filter(v=>mesmoMesAno(v.data,mes,ano)); let rows=db.materiais.map(m=>{let mesV=vendas.filter(v=>v.material===m.nome),anoV=db.vendas.filter(v=>v.material===m.nome&&getDate(v.data)?.getFullYear()===Number(ano)); let qtd=mesV.reduce((a,v)=>a+Number(v.quantidade||0),0),fat=mesV.reduce((a,v)=>a+Number(v.total||0),0),qtdA=anoV.reduce((a,v)=>a+Number(v.quantidade||0),0),fatA=anoV.reduce((a,v)=>a+Number(v.total||0),0); let preco=qtd?fat/qtd:0,precoAno=qtdA?fatA/qtdA:0; let sit=preco>precoAno?'Ganho':preco<precoAno?'Perda':'Neutro'; return {mat:m.nome,categoria:m.categoria,tipo:m.tipoPadrao||'',qtd,fat,preco,precoAno,sit}}).filter(r=>(!matFiltro||r.mat===matFiltro)&&(!cat||r.categoria===cat)&&(!sitFiltro||r.sit===sitFiltro)&&(!ocultarZero||r.qtd>0)); let volume=rows.reduce((a,r)=>a+r.qtd,0),faturamento=rows.reduce((a,r)=>a+r.fat,0),precoGeral=volume?faturamento/volume:0; let maiorFat=[...rows].sort((a,b)=>b.fat-a.fat)[0],maiorPreco=[...rows].filter(r=>r.qtd>0).sort((a,b)=>b.preco-a.preco)[0],perdas=rows.filter(r=>r.sit==='Perda').length,ganhos=rows.filter(r=>r.sit==='Ganho').length; precoResumo.innerHTML=`<div class="dashboard-cards"><div class="card"><div>Volume vendido</div><div class="card-value">${num(volume)} kg</div></div><div class="card"><div>Faturamento</div><div class="card-value">${moeda(faturamento)}</div></div><div class="card"><div>Preço médio geral</div><div class="card-value">${moeda(precoGeral)}/kg</div></div><div class="card"><div>Maior faturamento</div><div class="card-value" style="font-size:1.1rem">${maiorFat?escapeHtml(maiorFat.mat):'-'}</div><small>${maiorFat?moeda(maiorFat.fat):''}</small></div><div class="card"><div>Maior preço médio</div><div class="card-value" style="font-size:1.1rem">${maiorPreco?escapeHtml(maiorPreco function renderCadastros(){dynamicView().innerHTML=blocoCadastroCooperativa()+`<div class="card-panel"><h2>${editMaterialNome?'✏️ Editar Material':'⚙️ Cadastro de Materiais'}</h2><div class="notice"><strong>Lista oficial pré-cadastrada:</strong> os materiais já entram com categoria, unidade e tipo padrão. Nos lançamentos, essas informações são preenchidas automaticamente.</div><div class="form-grid"><div class="field"><label for="novoMaterial">Nome do material</label><input id="novoMaterial" placeholder="Ex.: PET, papelão, alumínio"></div><div class="field"><label for="novaCategoria">Categoria</label><select id="novaCategoria">${db.categorias.map(c=>`<option>${escapeHtml(c)}</option>`).join('')}</select></div><div class="field"><label for="novaUnidade">Unidade de medida</label><input id="novaUnidade" placeholder="Ex.: kg" value="kg"></div><div class="field"><label for="novoTipoPadrao">Tipo padrão</label><select id="novoTipoPadrao"><option>Bruto</option><option>Processado</option><option>Rejeito</option></select></div></div><div class="btn-row"><button id="addMaterial">${editMaterialNome?'Atualizar Material':'Adicionar Material'}</button><button id="cancelarMat" class="secondary" style="display:${editMaterialNome?'inline-block':'none'}">Cancelar</button></div><hr style="margin:1rem 0;border:none;border-top:1px solid #e1e6eb"><div class="filter-bar"><div class="filter-field"><label>Pesquisar material</label><input type="text" id="buscaListaMateriais" placeholder="Digite para localizar"></div><div class="filter-field"><label>Categoria</label><select id="fMatCategoria">${optCategorias()}</select></div><div class="filter-field"><label>Tipo</label><select id="fMatTipo"><option value="">Todos</option><option>Bruto</option><option>Processado</option><option>Rejeito</option></select></div><button id="btnFiltrarMateriais" class="info">Filtrar</button></div><div id="listaMateriais"></div></div>`; document.getElementById('salvarDadosCooperativa').onclick=salvarDadosCooperativaFn; addMaterial.onclick=salvarMaterial; cancelarMat.onclick=()=>{editMaterialNome=null;renderCadastros()}; btnFiltrarMateriais.onclick=listarMateriais; buscaListaMateriais.oninput=listarMateriais; fMatCategoria.onchange=listarMateriais; fMatTipo.onchange=listarMateriais; if(editMaterialNome)popularMaterial(editMaterialNome); listarMateriais();}
function salvarMaterial(){let nome=novoMaterial.value.trim().toUpperCase(); if(!nome)return alert('Informe o material.'); if(!editMaterialNome&&db.materiais.some(m=>m.nome===nome))return alert('Material já existe.'); let item={nome,categoria:novaCategoria.value,unidade:novaUnidade.value||'kg',tipoPadrao:novoTipoPadrao.value}; if(editMaterialNome){let i=db.materiais.findIndex(m=>m.nome===editMaterialNome); if(i>=0){db.producao.forEach(p=>{if(p.material===editMaterialNome){p.material=nome;p.categoria=item.categoria;p.unidade=item.unidade}}); db.vendas.forEach(v=>{if(v.material===editMaterialNome)v.material=nome}); db.materiais[i]=item;} editMaterialNome=null}else db.materiais.push(item); salvarDB(); renderCadastros();}
function popularMaterial(nome){let m=db.materiais.find(x=>x.nome===nome); if(!m)return; novoMaterial.value=m.nome; novaCategoria.value=m.categoria; novaUnidade.value=m.unidade||'kg'; novoTipoPadrao.value=m.tipoPadrao||'Processado';}
function listarMateriais(){let q=document.getElementById('buscaListaMateriais')?.value?.toLowerCase()||'';let cat=document.getElementById('fMatCategoria')?.value||'';let tipo=document.getElementById('fMatTipo')?.value||'';let lista=db.materiais.filter(m=>(!q||m.nome.toLowerCase().includes(q)||m.categoria.toLowerCase().includes(q))&&(!cat||m.categoria===cat)&&(!tipo||m.tipoPadrao===tipo));listaMateriais.innerHTML=`<div class="notice"><strong>${lista.length}</strong> materiais encontrados de <strong>${db.materiais.length}</strong> cadastrados.</div><table><tr><th>Material</th><th>Categoria</th><th>Unidade</th><th>Tipo padrão</th><th>Ações</th></tr>${lista.map(m=>`<tr><td>${escapeHtml(m.nome)}</td><td>${escapeHtml(m.categoria)}</td><td>${escapeHtml(m.unidade||'kg')}</td><td>${escapeHtml(m.tipoPadrao||'Processado')}</td><td><button class="mini-btn info" onclick="editarMaterial('${escapeHtml(m.nome)}')">✏️ Editar</button> <button class="mini-btn danger" onclick="excluirMaterial('${escapeHtml(m.nome)}')">🗑️ Excluir</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhum material encontrado.</td></tr>'}</table>`;}
function editarMaterial(nome){editMaterialNome=nome.replace(/&#39;/g,"'").replace(/&amp;/g,'&');renderCadastros()} function excluirMaterial(nome){nome=nome.replace(/&#39;/g,"'").replace(/&amp;/g,'&'); if(db.producao.some(p=>p.material===nome)||db.vendas.some(v=>v.material===nome))return alert('Não é possível excluir material com produção ou venda lançada. Edite ou inative futuramente.'); if(confirm('Excluir material?')){db.materiais=db.materiais.filter(m=>m.nome!==nome);salvarDB();renderCadastros()}}

function diasNoMes(mes,ano){return new Date(Number(ano),Number(mes),0).getDate()}
function cooperadosAtivosLista(){return db.cooperados.filter(c=>(c.ativo||'Sim')==='Sim'&&(c.situacaoOperacional||'Ativo')==='Ativo').sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||'')))}
function statusMeta(valor,meta,tipo='maiorMelhor'){
    valor=Number(valor)||0; meta=Number(meta)||0;
    if(!meta)return {txt:'Sem meta',cls:'sem-warning',card:'vista-warning'};
    if(tipo==='menorMelhor'){
        if(valor<=meta)return {txt:'Dentro da meta',cls:'sem-good',card:'vista-good'};
        if(valor<=meta*1.2)return {txt:'Atenção',cls:'sem-warning',card:'vista-warning'};
        return {txt:'Crítico',cls:'sem-danger',card:'vista-danger'};
    }
    if(valor>=meta)return {txt:'Dentro da meta',cls:'sem-good',card:'vista-good'};
    if(valor>=meta*0.8)return {txt:'Atenção',cls:'sem-warning',card:'vista-warning'};
    return {txt:'Crítico',cls:'sem-danger',card:'vista-danger'};
}
function dadosPeriodoGestao(mes,ano){
    let vendas=db.vendas.filter(v=>mesmoMesAno(v.data,mes,ano));
    let producao=db.producao.filter(p=>mesmoMesAno(p.data,mes,ano));
    let despesas=db.despesas.filter(d=>despesaEstaAtiva(d)).filter(d=>{let dataBase=d.situacao==='Pago'&&d.dataPagamento?d.dataPagamento:(d.dataVencimento||d.dataLancamento||d.data); return mesmoMesAno(dataBase,mes,ano)});
    let despPagas=despesas.filter(d=>d.situacao==='Pago');
    let r=resumoProducao(producao);
    let faturamento=vendas.reduce((a,v)=>a+(Number(v.total)||0),0);
    let custos=despPagas.reduce((a,d)=>a+(Number(d.valor)||0),0);
    let resultado=faturamento-custos;
    let volumeVendido=vendas.reduce((a,v)=>a+(Number(v.quantidade)||0),0);
    let ativos=cooperadosAtivosLista().length;
    let faltas=contarFaltas(mes,ano);
    let freq=freqMedia(mes,ano);
    let ocorrenciasMes=db.ocorrenciasSaude.filter(o=>mesmoMesAno(o.data,mes,ano));
    let acidentes=ocorrenciasMes.length;
    let afastados=new Set(db.ocorrenciasSaude.filter(o=>temAfastamentoAtivo(o)).map(o=>String(o.cooperadoId))).size;
    let diasPerdidos=(db.ocorrenciasSaude||[]).reduce((a,o)=>a+diasPerdidosNoPeriodo(o,mes,ano),0);
    let semAcidente=diasSemAcidente();
    let retirada=ativos?resultado/ativos:0;
    return {faturamento,custos,resultado,producao:r.total,rejeito:r.rejeito,eficiencia:r.eficiencia,volumeVendido,ativos,faltas,freq,acidentes,afastados,diasPerdidos,semAcidente,retirada};
}
function metaValor(chave,padrao=0){return Number((db.metasVista||{})[chave]??padrao)||0}
function salvarMetasVista(){
    db.metasVista={faturamento:Number(metaFaturamento.value)||0,despesas:Number(metaDespesas.value)||0,resultado:Number(metaResultado.value)||0,producao:Number(metaProducao.value)||0,rejeito:Number(metaRejeito.value)||0,frequencia:Number(metaFrequencia.value)||0,acidentes:Number(metaAcidentes.value)||0,retirada:Number(metaRetirada.value)||0};
    salvarDB(); carregarGestaoVista(); alert('Metas salvas.');
}
function cardVista(icon,titulo,valor,meta,status){return `<div class="vista-card ${status.card}"><div class="vista-card-top"><div><div class="vista-title">${titulo}</div><div class="vista-value">${valor}</div><div class="vista-meta">Meta: ${meta}</div></div><div class="vista-icon">${icon}</div></div><div><span class="semaforo ${status.cls}">${status.txt}</span></div></div>`}
function renderGestaoVista(){dynamicView().innerHTML=`<div class="card-panel"><div class="section-title"><div><h2>🧭 Gestão à Vista</h2><p class="muted">Painel visual para acompanhamento mensal da cooperativa.</p></div><span class="muted">Leitura rápida, estilo quadro operacional</span></div><div class="filter-bar"><div class="filter-field"><label>Mês</label><select id="gvMes">${optMes(mesAtual(),true)}</select></div><div class="filter-field"><label>Ano</label><select id="gvAno">${optAno()}</select></div><button id="btnGV" class="info">Atualizar</button></div><div id="gvPainel"></div></div><div class="card-panel"><h3>🎯 Metas da Gestão à Vista</h3><div class="notice">As metas alimentam o semáforo dos indicadores. Deixe em branco ou zero quando ainda não houver meta definida.</div><div class="meta-grid"><div class="field meta-box"><label>Valor arrecadado mínimo</label><input type="number" id="metaFaturamento" value="${metaValor('faturamento')}"></div><div class="field meta-box"><label>Despesa máxima</label><input type="number" id="metaDespesas" value="${metaValor('despesas')}"></div><div class="field meta-box"><label>Resultado mínimo</label><input type="number" id="metaResultado" value="${metaValor('resultado')}"></div><div class="field meta-box"><label>Material triado mínimo kg</label><input type="number" id="metaProducao" value="${metaValor('producao')}"></div><div class="field meta-box"><label>Rejeito máximo kg</label><input type="number" id="metaRejeito" value="${metaValor('rejeito')}"></div><div class="field meta-box"><label>Frequência mínima %</label><input type="number" id="metaFrequencia" value="${metaValor('frequencia',90)}"></div><div class="field meta-box"><label>Acidentes máximos</label><input type="number" id="metaAcidentes" value="${metaValor('acidentes',0)}"></div><div class="field meta-box"><label>Retirada média mínima</label><input type="number" id="metaRetirada" value="${metaValor('retirada')}"></div></div><div class="btn-row" style="margin-top:1rem"><button id="salvarMetas" class="info">Salvar Metas</button></div></div>`; btnGV.onclick=carregarGestaoVista; salvarMetas.onclick=salvarMetasVista; carregarGestaoVista();}
function carregarGestaoVista(){
    let mes=gvMes.value,ano=gvAno.value,d=dadosPeriodoGestao(mes,ano);
    let rotuloOcorrencias=mes?'Ocorrências do mês':'Ocorrências do período';
    let rotuloFaltas=mes?'Faltas no mês':'Faltas no período';
    let bloco=(titulo,cards)=>`<div class="vista-bloco"><div class="vista-bloco-titulo">${titulo}</div><div class="vista-bloco-grid">${cards.join('')}</div></div>`;
    let cardsFinanceiro=[
        cardVista('💰','Valor Arrecadado',moeda(d.faturamento),metaValor('faturamento')?moeda(metaValor('faturamento')):'Sem meta',statusMeta(d.faturamento,metaValor('faturamento'))),
        cardVista('💸','Despesas pagas',moeda(d.custos),metaValor('despesas')?moeda(metaValor('despesas')):'Sem meta',statusMeta(d.custos,metaValor('despesas'),'menorMelhor')),
        cardVista('📈','Resultado',moeda(d.resultado),metaValor('resultado')?moeda(metaValor('resultado')):'Sem meta',statusMeta(d.resultado,metaValor('resultado')))
    ];
    let cardsProducao=[
        cardVista('♻️','Material Triado',num(d.producao)+' kg',metaValor('producao')?num(metaValor('producao'))+' kg':'Sem meta',statusMeta(d.producao,metaValor('producao'))),
        cardVista('🗑️','Rejeito',num(d.rejeito)+' kg',metaValor('rejeito')?num(metaValor('rejeito'))+' kg':'Sem meta',statusMeta(d.rejeito,metaValor('rejeito'),'menorMelhor')),
        cardVista('⚙️','Eficiência da triagem',num(d.eficiencia,1)+'%','Quanto maior, melhor',statusMeta(d.eficiencia,80))
    ];
    let cardsPessoas=[
        cardVista('👥','Cooperados ativos',String(d.ativos),'Cadastro de cooperados',statusMeta(d.ativos,1)),
        cardVista('📅','Frequência média',num(d.freq,1)+'%',metaValor('frequencia')?num(metaValor('frequencia'),1)+'%':'90%',statusMeta(d.freq,metaValor('frequencia',90))),
        cardVista('❌',rotuloFaltas,String(d.faltas),'Quanto menor, melhor',statusMeta(d.faltas,0,'menorMelhor'))
    ];
    let cardsSaude=[
        cardVista('🚑',rotuloOcorrencias,String(d.acidentes),metaValor('acidentes')?String(metaValor('acidentes')):'0',statusMeta(d.acidentes,metaValor('acidentes',0),'menorMelhor')),
        cardVista('🏥','Cooperados afastados',String(d.afastados),'0',statusMeta(d.afastados,0,'menorMelhor')),
        cardVista('📅','Dias perdidos',String(d.diasPerdidos)+' dias','Quanto menor, melhor',statusMeta(d.diasPerdidos,0,'menorMelhor'))
    ];
    let cardsDesempenho=[
        cardVista('🟢','Dias sem acidente',d.semAcidente===null?'Sem registro':String(d.semAcidente)+' dias','Quanto maior, melhor',d.semAcidente===null?statusMeta(0,0):statusMeta(d.semAcidente,30)),
        cardVista('💵','Retirada média',moeda(d.retirada),metaValor('retirada')?moeda(metaValor('retirada')):'Sem meta',statusMeta(d.retirada,metaValor('retirada')))
    ];
    let html=`${bloco('💰 Financeiro',cardsFinanceiro)}${bloco('♻️ Produção',cardsProducao)}${bloco('👥 Pessoas',cardsPessoas)}${bloco('🚑 Segurança e Saúde',cardsSaude)}${bloco('📊 Desempenho',cardsDesempenho)}<div class="notice" style="margin-top:1rem"><strong>Leitura do painel:</strong> os indicadores são alimentados por Vendas, Despesas, Produção, Cadastro de Cooperados, Frequência e Saúde.</div>`;
    gvPainel.innerHTML=html;
}
function contarFaltas(mes,ano){return db.frequencia.filter(f=>mesmoMesAno(f.data,mes,ano)&&f.status==='A').length}
function freqMedia(mes,ano){let regs=db.frequencia.filter(f=>mesmoMesAno(f.data,mes,ano)&&(f.status==='P'||f.status==='A')); if(!regs.length)return 0; let pres=regs.filter(f=>f.status==='P').length; return pres/regs.length*100}

function diffDiasInclusivo(dataInicio,dataFim){let ini=getDate(dataInicio),fim=getDate(dataFim||hojeISO()); if(!ini||!fim||fim<ini)return 0; return Math.floor((fim-ini)/(1000*60*60*24))+1}
function statusOcorrencia(o){if(o.status)return o.status; if(String(o.afastamento)==='Sim')return 'Afastado'; return 'Encerrada'}
function temAfastamentoAtivo(o){return String(o.afastamento)==='Sim'&&statusOcorrencia(o)!=='Encerrada'}
function dataFimOcorrencia(o){return statusOcorrencia(o)==='Encerrada'&&o.dataRetorno?o.dataRetorno:hojeISO()}
function diasAfastamentoOcorrencia(o){if(String(o.afastamento)!=='Sim')return 0; return diffDiasInclusivo(o.data,dataFimOcorrencia(o))}
function diasPerdidosNoPeriodo(o,mes,ano){
    if(String(o.afastamento)!=='Sim')return 0;
    let ini=getDate(o.data),fim=getDate(dataFimOcorrencia(o));
    if(!ini||!fim)return 0;
    let iniPeriodo,fimPeriodo;
    if(!mes){
        iniPeriodo=getDate(`${ano}-01-01`);
        fimPeriodo=getDate(`${ano}-12-31`);
    }else{
        iniPeriodo=getDate(`${ano}-${String(mes).padStart(2,'0')}-01`);
        fimPeriodo=getDate(`${ano}-${String(mes).padStart(2,'0')}-${String(diasNoMes(mes,ano)).padStart(2,'0')}`);
    }
    if(!iniPeriodo||!fimPeriodo)return 0;
    let inicio=ini>iniPeriodo?ini:iniPeriodo;
    let final=fim<fimPeriodo?fim:fimPeriodo;
    if(final<inicio)return 0;
    let dias=Math.floor((final-inicio)/(1000*60*60*24))+1;
    return Number.isFinite(dias)?dias:0;
}
function diasSemAcidente(){let ocorrencias=(db.ocorrenciasSaude||[]).filter(o=>o.data).sort((a,b)=>String(b.data).localeCompare(String(a.data))); if(!ocorrencias.length)return null; return Math.max(0,Math.floor((getDate(hojeISO())-getDate(ocorrencias[0].data))/(1000*60*60*24)))}
function chipStatusOcorrencia(st){let cls=st==='Encerrada'?'chip-pago':st==='Afastado'?'chip-vencido':'chip-pendente'; return `<span class="status-chip ${cls}">${escapeHtml(st)}</span>`}
function getFreqRegistro(coopId,data){return db.frequencia.find(f=>String(f.cooperadoId)===String(coopId)&&f.data===data)}
function cicloFreq(status){return status==='P'?'A':status==='A'?'N':'P'}
function setFrequencia(coopId,data,status){let reg=getFreqRegistro(coopId,data); if(status==='N'){if(reg)db.frequencia=db.frequencia.filter(f=>f.id!==reg.id)}else if(reg){reg.status=status}else{db.frequencia.push({id:Date.now()+Math.random(),cooperadoId:coopId,data,status})} salvarDB(); carregarFrequencia();}
function toggleFrequencia(coopId,data){let reg=getFreqRegistro(coopId,data); let novo=reg?.status==='P'?'A':reg?.status==='A'?'N':'P'; setFrequencia(coopId,data,novo);}
function renderPessoas(){dynamicView().innerHTML=`<div class="card-panel"><div class="section-title"><div><h2>👥 Pessoas</h2><p class="muted">Frequência mensal e saúde/segurança dos cooperados.</p></div></div><div class="tabs"><button id="tabFreq" class="tab-btn active">📅 Frequência Mensal</button><button id="tabSaude" class="tab-btn">🚑 Saúde e Segurança</button></div><div id="pessoasConteudo"></div></div>`; tabFreq.onclick=()=>{tabFreq.classList.add('active');tabSaude.classList.remove('active');renderFrequencia()}; tabSaude.onclick=()=>{tabSaude.classList.add('active');tabFreq.classList.remove('active');renderSaude()}; renderFrequencia();}
function renderFrequencia(){pessoasConteudo.innerHTML=`<div class="notice"><strong>Chamada mensal:</strong> a lista é gerada automaticamente com os cooperados ativos. Em cada dia, selecione Presença, Ausência ou deixe sem informação.</div><div class="filter-bar"><div class="filter-field"><label>Mês</label><select id="freqMes">${optMes(mesAtual(),true)}</select></div><div class="filter-field"><label>Ano</label><select id="freqAno">${optAno()}</select></div><button id="btnFreq" class="info">Atualizar</button></div><div id="freqResumo"></div><div id="freqTabela"></div>`; btnFreq.onclick=carregarFrequencia; carregarFrequencia();}
function carregarFrequencia(){let mes=Number(freqMes.value),ano=Number(freqAno.value),dias=diasNoMes(mes,ano),coops=cooperadosAtivosLista(); let faltas=contarFaltas(mes,ano),freq=freqMedia(mes,ano); freqResumo.innerHTML=`<div class="dashboard-cards"><div class="card"><div>Cooperados ativos</div><div class="card-value">${coops.length}</div></div><div class="card"><div>Frequência média</div><div class="card-value">${num(freq,1)}%</div></div><div class="card"><div>Faltas no mês</div><div class="card-value">${faltas}</div></div></div>`; if(!coops.length){freqTabela.innerHTML='<div class="empty">Cadastre cooperados ativos para gerar a frequência.</div>';return} let head=Array.from({length:dias},(_,i)=>`<th>${String(i+1).padStart(2,'0')}</th>`).join(''); let rows=coops.map(c=>{let tds=Array.from({length:dias},(_,i)=>{let dia=String(i+1).padStart(2,'0'),data=`${ano}-${String(mes).padStart(2,'0')}-${dia}`,reg=getFreqRegistro(c.id,data),st=reg?.status||'N',cls=st==='P'?'presente':st==='A'?'ausente':'neutro';return `<td><select class="freq-select ${cls}" onchange="setFrequencia(${c.id},'${data}',this.value)"><option value="N" ${st==='N'?'selected':''}>-</option><option value="P" ${st==='P'?'selected':''}>Presença</option><option value="A" ${st==='A'?'selected':''}>Ausência</option></select></td>`}).join(''); let regs=db.frequencia.filter(f=>String(f.cooperadoId)===String(c.id)&&mesmoMesAno(f.data,mes,ano)); let p=regs.filter(f=>f.status==='P').length,a=regs.filter(f=>f.status==='A').length,perc=(p+a)?p/(p+a)*100:0; return `<tr><td style="text-align:left"><strong>${escapeHtml(c.nome)}</strong><br><span class="muted">${escapeHtml(c.funcao||'')}</span></td>${tds}<td><strong>${p}</strong></td><td><strong>${a}</strong></td><td><strong>${num(perc,1)}%</strong></td></tr>`}).join(''); freqTabela.innerHTML=`<div class="table-wrap"><table class="freq-table"><tr><th>Cooperado</th>${head}<th>Pres.</th><th>Aus.</th><th>%</th></tr>${rows}</table></div>`;}
function renderSaude(){let coops=cooperadosAtivosLista(); pessoasConteudo.innerHTML=`<div class="notice"><strong>Registro de saúde e segurança:</strong> registre a ocorrência uma única vez. Se houver afastamento, os dias perdidos são calculados automaticamente até a data de retorno ou até o encerramento.</div><div class="form-grid"><div class="field"><label>Data da ocorrência</label><input type="date" id="ocData" value="${hojeISO()}"></div><div class="field"><label>Cooperado</label><select id="ocCoop">${coops.map(c=>{let af=encontrarAfastamentoAtivoCooperado(c.id,editOcorrenciaId);return `<option value="${c.id}">${escapeHtml(c.nome)}${af?' (AFASTADO desde '+formatarDataBR(af.data)+')':''}</option>`}).join('')}</select></div><div class="field"><label>Tipo de ocorrência</label><select id="ocTipo"><option>Corte</option><option>Queda</option><option>Perfuração</option><option>Contusão</option><option>Mal-estar</option><option>Outro</option></select></div><div class="field"><label>Houve afastamento?</label><select id="ocAfastamento"><option>Não</option><option>Sim</option></select></div><div class="field"><label>Status</label><select id="ocStatus"><option>Aberta</option><option>Afastado</option><option>Encerrada</option></select></div><div class="field"><label>Data de retorno / encerramento</label><input type="date" id="ocRetorno"></div><div class="field"><label>Observações</label><textarea id="ocObs" placeholder="Descrição resumida"></textarea></div></div><div class="btn-row"><button id="salvarOcorrencia" class="info">${editOcorrenciaId?'Atualizar Ocorrência':'Registrar Ocorrência'}</button><button id="cancelarOcorrencia" class="secondary" style="display:${editOcorrenciaId?'inline-block':'none'}">Cancelar edição</button></div><hr style="margin:1rem 0;border:none;border-top:1px solid #e1e6eb"><div class="filter-bar"><div class="filter-field"><label>Mês</label><select id="saudeMes">${optMes(mesAtual(),true)}</select></div><div class="filter-field"><label>Ano</label><select id="saudeAno">${optAno()}</select></div><button id="btnSaude" class="info">Atualizar</button></div><div id="saudeLista"></div>`; ocAfastamento.onchange=()=>{if(ocAfastamento.value==='Sim'){ocStatus.value='Afastado';ocRetorno.value=''}else{ocStatus.value='Encerrada';ocRetorno.value=ocData.value}}; salvarOcorrencia.onclick=salvarOcorrenciaSaude; cancelarOcorrencia.onclick=()=>{editOcorrenciaId=null;renderSaude()}; btnSaude.onclick=listarOcorrenciasSaude; if(editOcorrenciaId)popularFormOcorrenciaSaude(editOcorrenciaId); listarOcorrenciasSaude();}
function salvarOcorrenciaSaude(){if(!ocData.value||!ocCoop.value)return alert('Informe data e cooperado.'); let afastamento=ocAfastamento.value,status=ocStatus.value,dataRetorno=ocRetorno.value; if(afastamento==='Não'){status='Encerrada'; dataRetorno=ocData.value} if(afastamento==='Sim'&&status!=='Encerrada'){dataRetorno=''} if(status==='Aberta'&&afastamento==='Sim')status='Afastado'; if(status==='Encerrada'&&afastamento==='Sim'&&!dataRetorno)return alert('Informe a data de retorno/encerramento ou mantenha o status como Afastado.'); let item={id:editOcorrenciaId||Date.now(),data:ocData.value,cooperadoId:ocCoop.value,tipo:ocTipo.value,afastamento,status,dataRetorno,obs:ocObs.value}; if(editOcorrenciaId){let i=db.ocorrenciasSaude.findIndex(o=>o.id===editOcorrenciaId); if(i>=0)db.ocorrenciasSaude[i]=item; editOcorrenciaId=null;}else{db.ocorrenciasSaude.push(item);} salvarDB(); renderSaude();}

️ Excluir</button></div></td></tr>`}).join('')||'<tr><td colspan="9">Sem ocorrências no período.</td></tr>'}</table></div>`;}
function encerrarOcorrenciaSaude(id){let o=db.ocorrenciasSaude.find(x=>x.id===id); if(!o)return; let data=prompt('Informe a data de retorno/encerramento (AAAA-MM-DD):',hojeISO()); if(!data)return; o.status='Encerrada'; o.dataRetorno=data; salvarDB(); listarOcorrenciasSaude();}
function reabrirOcorrenciaSaude(id){let o=db.ocorrenciasSaude.find(x=>x.id===id); if(!o)return; o.status=String(o.afastamento)==='Sim'?'Afastado':'Aberta'; o.dataRetorno=''; salvarDB(); listarOcorrenciasSaude();}

<button id="salvarMetas" class="info">Salvar Metas</button></div></div>`; btnGV.onclick=carregarGestaoVista; salvarMetas.onclick=salvarMetasVista; carregarGestaoVista();}
function carregarGestaoVista(){let mes=gvMes.value,ano=gvAno.value,d=dadosPeriodoGestao(mes,ano); let rotuloOcorrencias=mes?'Ocorrências do mês':'Ocorrências do período'; let rotuloFaltas=mes?'Faltas no mês':'Faltas no período'; let html=`<div class="vista-grid">${cardVista('💰','Valor Arrecadado',moeda(d.faturamento),metaValor('faturamento')?moeda(metaValor('faturamento')):'Sem meta',statusMeta(d.faturamento,metaValor('faturamento')))}${cardVista('💸','Despesas pagas',moeda(d.custos),metaValor('despesas')?moeda(metaValor('despesas')):'Sem meta',statusMeta(d.custos,metaValor('despesas'),'menorMelhor'))}${cardVista('📈','Resultado',moeda(d.resultado),metaValor('resultado')?moeda(metaValor('resultado')):'Sem meta',statusMeta(d.resultado,metaValor('resultado')))}${cardVista('♻️','Material Triado',num(d.producao)+' kg',metaValor('producao')?num(metaValor('producao'))+' kg':'Sem meta',statusMeta(d.producao,metaValor('producao')))}${cardVista('🗑️','Rejeito',num(d.rejeito)+' kg',metaValor('rejeito')?num(metaValor('rejeito'))+' kg':'Sem meta',statusMeta(d.rejeito,metaValor('rejeito'),'menorMelhor'))}${cardVista('⚙️','Eficiência da triagem',num(d.eficiencia,1)+'%','Quanto maior, melhor',statusMeta(d.eficiencia,80))}${cardVista('👥','Cooperados ativos',String(d.ativos),'Cadastro de cooperados',statusMeta(d.ativos,1))}${cardVista('📅','Frequência média',num(d.freq,1)+'%',metaValor('frequencia')?num(metaValor('frequencia'),1)+'%':'90%',statusMeta(d.freq,metaValor('frequencia',90)))}${cardVista('❌',rotuloFaltas,String(d.faltas),'Quanto menor, melhor',statusMeta(d.faltas,0,'menorMelhor'))}${cardVista('🚑',rotuloOcorrencias,String(d.acidentes),metaValor('acidentes')?String(metaValor('acidentes')):'0',statusMeta(d.acidentes,metaValor('acidentes',0),'menorMelhor'))}${cardVista('🏥','Cooperados afastados',String(d.afastados),'0',statusMeta(d.afastados,0,'menorMelhor'))}${cardVista('📅','Dias perdidos',String(d.diasPerdidos)+' dias','Quanto menor, melhor',statusMeta(d.diasPerdidos,0,'menorMelhor'))}${cardVista('🟢','Dias sem acidente',d.semAcidente===null?'Sem registro':String(d.semAcidente)+' dias','Quanto maior, melhor',d.semAcidente===null?statusMeta(0,0):statusMeta(d.semAcidente,30))}${cardVista('💵','Retirada média',moeda(d.retirada),metaValor('retirada')?moeda(metaValor('retirada')):'Sem meta',statusMeta(d.retirada,metaValor('retirada')))}</div><div class="notice" style="margin-top:1rem"><strong>Leitura do painel:</strong> os indicadores são alimentados por Vendas, Despesas, Produção, Cadastro de Cooperados, Frequência e Saúde.</div>`; gvPainel.innerHTML=html;}
function contarFaltas(mes,ano){return db.frequencia.filter(f=>mesmoMesAno(f.data,mes,ano)&&f.status==='A').length}
function freqMedia(mes,ano){let regs=db.frequencia.filter(f=>mesmoMesAno(f.data,mes,ano)&&(f.status==='P'||f.status==='A')); if(!regs.length)return 0; let pres=regs.filter(f=>f.status==='P').length; return pres/regs.length*100}

function diffDiasInclusivo(dataInicio,dataFim){let ini=getDate(dataInicio),fim=getDate(dataFim||hojeISO()); if(!ini||!fim||fim<ini)return 0; return Math.floor((fim-ini)/(1000*60*60*24))+1}
function statusOcorrencia(o){if(o.status)return o.status; if(String(o.afastamento)==='Sim')return 'Afastado'; return 'Encerrada'}
function temAfastamentoAtivo(o){return String(o.afastamento)==='Sim'&&statusOcorrencia(o)!=='Encerrada'}
function dataFimOcorrencia(o){return statusOcorrencia(o)==='Encerrada'&&o.dataRetorno?o.dataRetorno:hojeISO()}
function diasAfastamentoOcorrencia(o){if(String(o.afastamento)!=='Sim')return 0; return diffDiasInclusivo(o.data,dataFimOcorrencia(o))}
function diasPerdidosNoPeriodo(o,mes,ano){
    if(String(o.afastamento)!=='Sim')return 0;
    let ini=getDate(o.data),fim=getDate(dataFimOcorrencia(o));
    if(!ini||!fim)return 0;
    let iniPeriodo,fimPeriodo;
    if(!mes){
        iniPeriodo=getDate(`${ano}-01-01`);
        fimPeriodo=getDate(`${ano}-12-31`);
    }else{
        iniPeriodo=getDate(`${ano}-${String(mes).padStart(2,'0')}-01`);
        fimPeriodo=getDate(`${ano}-${String(mes).padStart(2,'0')}-${String(diasNoMes(mes,ano)).padStart(2,'0')}`);
    }
    if(!iniPeriodo||!fimPeriodo)return 0;
    let inicio=ini>iniPeriodo?ini:iniPeriodo;
    let final=fim<fimPeriodo?fim:fimPeriodo;
    if(final<inicio)return 0;
    let dias=Math.floor((final-inicio)/(1000*60*60*24))+1;
    return Number.isFinite(dias)?dias:0;
}
function diasSemAcidente(){let ocorrencias=(db.ocorrenciasSaude||[]).filter(o=>o.data).sort((a,b)=>String(b.data).localeCompare(String(a.data))); if(!ocorrencias.length)return null; return Math.max(0,Math.floor((getDate(hojeISO())-getDate(ocorrencias[0].data))/(1000*60*60*24)))}
function chipStatusOcorrencia(st){let cls=st==='Encerrada'?'chip-pago':st==='Afastado'?'chip-vencido':'chip-pendente'; return `<span class="status-chip ${cls}">${escapeHtml(st)}</span>`}
function getFreqRegistro(coopId,data){return db.frequencia.find(f=>String(f.cooperadoId)===String(coopId)&&f.data===data)}
function cicloFreq(status){return status==='P'?'A':status==='A'?'N':'P'}
function setFrequencia(coopId,data,status){let reg=getFreqRegistro(coopId,data); if(status==='N'){if(reg)db.frequencia=db.frequencia.filter(f=>f.id!==reg.id)}else if(reg){reg.status=status}else{db.frequencia.push({id:Date.now()+Math.random(),cooperadoId:coopId,data,status})} salvarDB(); carregarFrequencia();}
function toggleFrequencia(coopId,data){let reg=getFreqRegistro(coopId,data); let novo=reg?.status==='P'?'A':reg?.status==='A'?'N':'P'; setFrequencia(coopId,data,novo);}

function dataDentroPeriodo(data,di,df,mes,ano){
    if(!data)return false;
    let d=getDate(data); if(!d)return false;
    if(di||df){let ini=di?getDate(di):null,fim=df?getDate(df):null; return (!ini||d>=ini)&&(!fim||d<=fim);}
    return mesmoMesAno(data,mes,ano);
}
function periodoRelatorioTexto(di,df,mes,ano){
    if(di||df)return `${di?formatarDataBR(di):'Início'} a ${df?formatarDataBR(df):'Hoje'}`;
    if(mes)return `${mesNome(Number(mes))} de ${ano}`;
    return `Ano de ${ano}`;
}
function consolidarRelatorioExecutivo(){
    let mes=document.getElementById('relMes')?.value||'', ano=document.getElementById('relAno')?.value||anoAtual(), di=document.getElementById('relDataIni')?.value||'', df=document.getElementById('relDataFim')?.value||'', cat=document.getElementById('relCategoria')?.value||'', mat=document.getElementById('relMaterial')?.value||'';
    let prod=db.producao.filter(p=>dataDentroPeriodo(p.data,di,df,mes,ano)&&p.tipo!=='Rejeito');
    let vendas=db.vendas.filter(v=>dataDentroPeriodo(v.data,di,df,mes,ano));
    function categoriaDe(material, fallback=''){let m=db.materiais.find(x=>x.nome===material)||{}; return fallback||m.categoria||'';}
    prod=prod.filter(p=>(!cat||(p.categoria||categoriaDe(p.material))===cat)&&(!mat||p.material===mat));
    vendas=vendas.filter(v=>{let c=v.categoria||categoriaDe(v.material); return (!cat||c===cat)&&(!mat||v.material===mat)});
    let prodTotal=prod.reduce((a,p)=>a+Number(p.quantidade||0),0);
    let vendidoTotal=vendas.reduce((a,v)=>a+Number(v.quantidade||0),0);
    let faturamento=vendas.reduce((a,v)=>a+Number(v.total||0),0);
    let precoMedio=vendidoTotal?faturamento/vendidoTotal:0;
    let estoqueFiltrado=calcularEstoque().filter(e=>{let c=categoriaDe(e.material); return (!cat||c===cat)&&(!mat||e.material===mat)});
    let estoqueAtual=estoqueFiltrado.reduce((a,e)=>a+Number(e.saldo||0),0);
    let materiaisComercializados=new Set(vendas.map(v=>v.material)).size;
    let porCategoria={}, porMaterialProd={}, vendasMaterial={}, compradores={};
    prod.forEach(p=>{let c=p.categoria||categoriaDe(p.material); porCategoria[c]=(porCategoria[c]||0)+Number(p.quantidade||0); porMaterialProd[p.material]=(porMaterialProd[p.material]||0)+Number(p.quantidade||0);});
    vendas.forEach(v=>{
        if(!vendasMaterial[v.material])vendasMaterial[v.material]={qtd:0,total:0,min:null,max:null,precos:[]};
        let vm=vendasMaterial[v.material],q=Number(v.quantidade||0),t=Number(v.total||0),pu=Number(v.precoUnit||0);
        vm.qtd+=q; vm.total+=t; if(pu>0){vm.min=vm.min===null?pu:Math.min(vm.min,pu); vm.max=vm.max===null?pu:Math.max(vm.max,pu); vm.precos.push(pu)}
        let comp=v.comprador||'Não informado', chave=`${comp}|||${v.material}`;
        if(!compradores[chave])compradores[chave]={comprador:comp,material:v.material,qtd:0,total:0};
        compradores[chave].qtd+=q; compradores[chave].total+=t;
    });
    let arrCategoria=Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]);
    let arrProdMaterial=Object.entries(porMaterialProd).sort((a,b)=>b[1]-a[1]);
    let arrVendaMaterial=Object.entries(vendasMaterial).map(([material,o])=>({material,...o,medio:o.qtd?o.total/o.qtd:0})).sort((a,b)=>b.total-a.total);
    let arrCompradores=Object.values(compradores).sort((a,b)=>b.total-a.total);
    return {mes,ano,di,df,cat,mat,periodo:periodoRelatorioTexto(di,df,mes,ano),prodTotal,vendidoTotal,faturamento,precoMedio,estoqueAtual,materiaisComercializados,arrCategoria,arrProdMaterial,arrVendaMaterial,arrCompradores};
}

function conclusoesRelatorio(d){
    let itens=[];
    let maiorCategoria=d.arrCategoria[0];
    let maiorProd=d.arrProdMaterial[0];
    let maiorFat=d.arrVendaMaterial[0];
    let melhorPreco=d.arrVendaMaterial.filter(o=>o.medio>0).sort((a,b)=>b.medio-a.medio)[0];
    let vendidoPerc=d.prodTotal?d.vendidoTotal/d.prodTotal*100:0;
    function add(titulo,texto){itens.push({titulo,texto});}
    if(d.prodTotal>0){
        let texto=`A cooperativa produziu ${num(d.prodTotal)} kg no período analisado.`;
        if(maiorCategoria)texto+=` A categoria ${escapeHtml(maiorCategoria[0])} representou ${num((maiorCategoria[1]/(d.prodTotal||1))*100,1)}% da produção total.`;
        add('🟢 Produção',texto);
    }
    if(d.vendidoTotal>0){
        add('💰 Comercialização',`Foram comercializados ${num(d.vendidoTotal)} kg, gerando faturamento de ${moeda(d.faturamento)} e preço médio geral de ${moeda(d.precoMedio)}/kg.`);
    }
    if(maiorFat||melhorPreco){
        let partes=[];
        if(maiorFat)partes.push(`${escapeHtml(maiorFat.material)} foi o material de maior faturamento (${moeda(maiorFat.total)}).`);
        if(melhorPreco)partes.push(`${escapeHtml(melhorPreco.material)} apresentou o maior preço médio de comercialização (${moeda(melhorPreco.medio)}/kg).`);
        add('📈 Inteligência de Mercado',partes.join(' '));
    }
    if(d.estoqueAtual>0){
        add('📦 Estoque e Potencial de Negócios',`Permanecem ${num(d.estoqueAtual)} kg em estoque, representando potencial para novas negociações e participação em rodadas de negócios.`);
    }
    let recomendacao='';
    if(d.prodTotal>0&&vendidoPerc<70)recomendacao=`Apenas ${num(vendidoPerc,1)}% da produção foi comercializada no período. Recomenda-se priorizar compradores para reduzir estoque e melhorar geração de caixa.`;
    else if(melhorPreco)recomendacao=`Recomenda-se fortalecer a segregação e a negociação dos materiais de maior preço médio, com destaque para ${escapeHtml(melhorPreco.material)}.`;
    else if(maiorProd)recomendacao=`Recomenda-se estruturar estratégia comercial específica para ${escapeHtml(maiorProd[0])}, material de maior volume produzido no período.`;
    else recomendacao='Não há dados suficientes para gerar recomendações estratégicas automáticas no período selecionado.';
    add('🎯 Recomendações Estratégicas',recomendacao);
    return `<div class="report-insight-grid">${itens.map(i=>`<div class="report-insight-item"><div class="report-insight-title">${i.titulo}</div><div class="report-insight-text">${i.texto}</div></div>`).join('')}</div>`;
}

        const mostrar=!termo||texto.includes(termo);
        sec.style.display=mostrar?'block':'none';

        if(det){

        }

/* ===== V26.5.0 - Sprint 1: Política Unificada de Cancelamento ===== */
const VERSAO_REGISTRO_AUDITORIA='2.0';
function agoraISO(){return new Date().toISOString()}
function registroAtivo(reg){return !reg || !reg.statusRegistro || reg.statusRegistro==='ATIVO'}
function registroCancelado(reg){return reg && reg.statusRegistro==='CANCELADO'}
function prepararAuditoriaRegistro(reg){
    if(!reg)return reg;
    if(!reg.statusRegistro)reg.statusRegistro='ATIVO';
    if(!reg.criadoEm)reg.criadoEm=reg.dataLancamento||reg.dataCriacao||reg.data||agoraISO();
    if(!reg.alteradoEm)reg.alteradoEm=reg.criadoEm;
    if(reg.canceladoEm===undefined)reg.canceladoEm=null;
    if(reg.canceladoPor===undefined)reg.canceladoPor='';
    if(reg.motivoCancelamento===undefined)reg.motivoCancelamento='';
    if(!reg.versaoRegistro)reg.versaoRegistro=VERSAO_REGISTRO_AUDITORIA;
    return reg;
}
function aplicarAuditoriaSalvar(novo,atual){
    prepararAuditoriaRegistro(novo);
    if(atual){
        novo.criadoEm=atual.criadoEm||novo.criadoEm||agoraISO();
        novo.statusRegistro=atual.statusRegistro||novo.statusRegistro||'ATIVO';
        novo.canceladoEm=atual.canceladoEm||null;
        novo.canceladoPor=atual.canceladoPor||'';
        novo.motivoCancelamento=atual.motivoCancelamento||'';
    }
    novo.alteradoEm=agoraISO();
    novo.versaoRegistro=VERSAO_REGISTRO_AUDITORIA;
    return novo;
}
function normalizarAuditoriaBase(){
    ['producao','vendas','despesas','cooperados','frequencia','ocorrenciasSaude'].forEach(mod=>{
        if(Array.isArray(db[mod]))db[mod].forEach(prepararAuditoriaRegistro);
    });
    if(Array.isArray(db.despesas))db.despesas.forEach(d=>{
        if(d.excluida && d.statusRegistro!=='CANCELADO'){
            d.statusRegistro='CANCELADO';
            d.canceladoEm=d.dataExclusao||d.canceladoEm||agoraISO();
            d.canceladoPor=d.canceladoPor||'Não informado';
            d.motivoCancelamento=d.motivoCancelamento||d.motivoExclusao||'Exclusão lógica anterior à V26.5.0';
        }
    });
    salvarDB();
}
function detalhesCancelamento(reg){
    if(!registroCancelado(reg))return '';
    const data=reg.canceladoEm?new Date(reg.canceladoEm).toLocaleString('pt-BR'):'';
    return `<span class="audit-cancelamento">🚫 CANCELADO<br>Cancelado por: ${escapeHtml(reg.canceladoPor||'Não informado')}<br>Data: ${escapeHtml(data||'-')}<br>Motivo: ${escapeHtml(reg.motivoCancelamento||'-')}</span>`;
}
function resumoCancelamento(modulo,reg){
    if(modulo==='producao')return `Produção\nData: ${formatarDataBR(reg.data)}\nMaterial: ${reg.material}\nQuantidade: ${num(reg.quantidade)} ${reg.unidade||'kg'}`;
    if(modulo==='vendas')return `Venda\nData: ${formatarDataBR(reg.data)}\nMaterial: ${reg.material}\nQuantidade: ${num(reg.quantidade)} ${reg.unidade||'kg'}\nTotal: ${moeda(reg.total)}`;
    if(modulo==='cooperados')return `Cooperado\nNome: ${reg.nome||'Sem nome'}\nCPF: ${reg.cpf||'-'}\nSituação: ${reg.situacaoOperacional||'-'}`;
    if(modulo==='ocorrenciasSaude')return `Ocorrência\nData: ${formatarDataBR(reg.data)}\nTipo: ${reg.tipo||'-'}\nStatus: ${statusOcorrencia(reg)}`;
    return 'Registro selecionado';
}
function cancelarRegistro(modulo,id,callback){
    const lista=db[modulo]||[];
    const reg=lista.find(x=>String(x.id)===String(id));
    if(!reg)return alert('Registro não encontrado.');
    if(registroCancelado(reg))return alert('Este registro já está cancelado.');
    const resumo=resumoCancelamento(modulo,reg);
    let responsavel=prompt(`${resumo}\n\nInforme quem está cancelando este registro:`);
    if(responsavel===null)return;
    responsavel=String(responsavel).trim();
    if(!responsavel)return alert('Informe o responsável pelo cancelamento.');
    let motivo=prompt(`${resumo}\n\nInforme o motivo do cancelamento:`);
    if(motivo===null)return;
    motivo=String(motivo).trim();
    if(!motivo)return alert('Informe o motivo do cancelamento.');
    if(!confirm(`${resumo}\n\nConfirmar cancelamento?\n\nResponsável: ${responsavel}\nMotivo: ${motivo}\n\nO registro continuará salvo para auditoria.`))return;
    prepararAuditoriaRegistro(reg);
    reg.statusRegistro='CANCELADO';
    reg.canceladoEm=agoraISO();
    reg.canceladoPor=responsavel;
    reg.motivoCancelamento=motivo;
    reg.alteradoEm=reg.canceladoEm;
    reg.versaoRegistro=VERSAO_REGISTRO_AUDITORIA;
    if(modulo==='cooperados'){
        reg.ativo='Não';
        if(!reg.situacaoAntesCancelamento)reg.situacaoAntesCancelamento=reg.situacaoOperacional||'';
        reg.situacaoOperacional='Desligado';
    }
    salvarDB();
    if(typeof callback==='function')callback(); else renderAtual();
}
function garantirFiltroCancelados(id,onchangeFn){
    const el=document.getElementById(id);
    if(!el)return false;
    el.onchange=onchangeFn;
    return !!el.checked;
}
function inserirFiltroCancelados(container, id, texto, onchangeFn){
    const bar=container?.querySelector?.('.filter-bar')||container;
    if(!bar || document.getElementById(id))return;
    const label=document.createElement('label');
    label.className='filtro-cancelados';
    label.innerHTML=`<input type="checkbox" id="${id}"> ${texto||'Mostrar cancelados'}`;
    bar.appendChild(label);
    document.getElementById(id).onchange=onchangeFn;
}

function encontrarAfastamentoAtivoCooperado(cooperadoId, ignorarId=null){
    return (db.ocorrenciasSaude||[]).find(o=>{

        if(String(o.afastamento)!=='Sim')return false;

function salvarOcorrenciaSaude(){
    if(!ocData.value||!ocCoop.value)return alert('Informe data e cooperado.');
    let afastamento=ocAfastamento.value,status=ocStatus.value,dataRetorno=ocRetorno.value;
    if(afastamento==='Não'){
        status='Encerrada';
        dataRetorno=ocData.value;
    }
    if(afastamento==='Sim'&&status!=='Encerrada'){
        dataRetorno='';
    }
    if(status==='Aberta'&&afastamento==='Sim'){
        status='Afastado';
    }
    if(status==='Encerrada'&&afastamento==='Sim'&&!dataRetorno){
        return alert('Informe a data de retorno/encerramento ou mantenha o status como Afastado.');
    }

    // V26.5.8B - Trava real: impede nova ocorrência quando já há afastamento ativo
    // A validação fica ANTES de gravar no db.ocorrenciasSaude.
    const afastamentoAtivo = encontrarAfastamentoAtivoCooperado(ocCoop.value, editOcorrenciaId);
    if(!editOcorrenciaId && afastamentoAtivo){
        const coop = db.cooperados.find(c=>String(c.id)===String(ocCoop.value));
        const nome = coop?.nome || 'Este cooperado';
        return alert(`Não é possível registrar nova ocorrência. ${nome} já possui afastamento ativo desde ${formatarDataBR(afastamentoAtivo.data)}. Encerre ou cancele a ocorrência anterior antes de registrar uma nova.`);
    }

    let atual=editOcorrenciaId?db.ocorrenciasSaude.find(o=>String(o.id)===String(editOcorrenciaId)):null;
    let item={id:editOcorrenciaId||Date.now(),data:ocData.value,cooperadoId:ocCoop.value,tipo:ocTipo.value,afastamento,status,dataRetorno,obs:ocObs.value};

function calcularEstoque(){
    let map=new Map();
    producoesAtivas().forEach(p=>{
        if(p.tipo==='Rejeito')return;
        let e=map.get(p.material)||{produzido:0,vendido:0};
        e.produzido+=Number(p.quantidade)||0;
        map.set(p.material,e);
    });
    vendasAtivas().forEach(v=>{
        let e=map.get(v.material)||{produzido:0,vendido:0};
        e.vendido+=Number(v.quantidade)||0;
        map.set(v.material,e);
    });
    return [...map.entries()].map(([material,e])=>({material,produzido:e.produzido,vendido:e.vendido,saldo:e.produzido-e.vendido})).sort((a,b)=>a.material.localeCompare(b.material));
}

function dadosPeriodoGestao(mes,ano){
    let vendas=vendasAtivas().filter(v=>mesmoMesAno(v.data,mes,ano));
    let producao=producoesAtivas().filter(p=>mesmoMesAno(p.data,mes,ano));
    let despesas=despesasAtivas().filter(d=>{
        let dataBase=d.situacao==='Pago'&&d.dataPagamento?d.dataPagamento:(d.dataVencimento||d.dataLancamento||d.data);
        return mesmoMesAno(dataBase,mes,ano);
    });
    let despPagas=despesas.filter(d=>d.situacao==='Pago');
    let r=resumoProducao(producao);
    let faturamento=vendas.reduce((a,v)=>a+(Number(v.total)||0),0);
    let custos=despPagas.reduce((a,d)=>a+(Number(d.valor)||0),0);
    let resultado=faturamento-custos;
    let volumeVendido=vendas.reduce((a,v)=>a+(Number(v.quantidade)||0),0);
    let ativos=cooperadosAtivosOperacionais().length;
    let faltas=contarFaltas(mes,ano);
    let freq=freqMedia(mes,ano);
    let ocorrenciasMes=ocorrenciasAtivas().filter(o=>mesmoMesAno(o.data,mes,ano));
    let acidentes=ocorrenciasMes.length;
    let afastados=new Set(ocorrenciasAtivas().filter(o=>temAfastamentoAtivo(o)).map(o=>String(o.cooperadoId))).size;
    let diasPerdidos=ocorrenciasAtivas().reduce((a,o)=>a+diasPerdidosNoPeriodo(o,mes,ano),0);
    let semAcidente=diasSemAcidente();
    let retirada=ativos?resultado/ativos:0;
    return {faturamento,custos,resultado,producao:r.total,rejeito:r.rejeito,eficiencia:r.eficiencia,volumeVendido,ativos,faltas,freq,acidentes,afastados,diasPerdidos,semAcidente,retirada};
}

function calcularPreco(){

    let vendasAtivasBase=vendasAtivas();

    let materiaisBase=(Array.isArray(db.materiais)?db.materiais:[]).filter(m=>registroAtivo(m));
    let rows=materiaisBase.map(m=>{
        let periodoV=vendasPeriodo.filter(v=>v.material===m.nome);
        let anoV=vendasAtivasBase.filter(v=>v.material===m.nome&&getDate(v.data)?.getFullYear()===Number(ano));
        let qtd=periodoV.reduce((a,v)=>a+Number(v.quantidade||0),0),fat=periodoV.reduce((a,v)=>a+Number(v.total||0),0),qtdA=anoV.reduce((a,v)=>a+Number(v.quantidade||0),0),fatA=anoV.reduce((a,v)=>a+Number(v.total||0),0);
        let preco=qtd?fat/qtd:0,precoAno=qtdA?fatA/qtdA:0;
        let sit=preco>precoAno?'Ganho':preco<precoAno?'Perda':'Neutro';
        if(!qtd && !qtdA) sit='Neutro';
        return {mat:m.nome,categoria:m.categoria,tipo:m.tipoPadrao||'',qtd,fat,preco,precoAno,sit}
    }).filter(r=>(!matFiltro||r.mat===matFiltro)&&(!cat||r.categoria===cat)&&(!sitFiltro||r.sit===sitFiltro)&&(!ocultarZero||r.qtd>0));
    let volume=rows.reduce((a,r)=>a+r.qtd,0),faturamento=rows.reduce((a,r)=>a+r.fat,0),precoGeral=volume?faturamento/volume:0;
    let maiorFat=[...rows].sort((a,b)=>b.fat-a.fat)[0],maiorPreco=[...rows].filter(r=>r.qtd>0).sort((a,b)=>b.preco-a.preco)[0],perdas=rows.filter(r=>r.sit==='Perda').length,ganhos=rows.filter(r=>r.sit==='Ganho').length;
