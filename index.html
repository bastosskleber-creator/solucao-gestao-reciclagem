    if(!rows.length){precoTable.innerHTML='<div class="empty">Sem vendas ativas para os filtros selecionados.</div>';return;}
    let cards=rows.sort((a,b)=>b.fat-a.fat).map(r=>{let cls=r.sit==='Ganho'?'chip-ganho':r.sit==='Perda'?'chip-perda':'chip-neutro';return `<div class="price-card"><div class="price-card-head"><div><h4>${escapeHtml(r.mat)}</h4><small>${escapeHtml(r.categoria)} • ${escapeHtml(r.tipo)}</small></div><span class="price-chip ${cls}">${r.sit}</span></div><div class="price-metrics"><div class="metric-box"><div class="metric-label">Volume período</div><div class="metric-value">${num(r.qtd)} kg</div></div><div class="metric-box"><div class="metric-label">Faturamento</div><div class="metric-value">${moeda(r.fat)}</div></div><div class="metric-box"><div class="metric-label">Preço período</div><div class="metric-value price-highlight">${moeda(r.preco)}/kg</div></div><div class="metric-box"><div class="metric-label">Média anual</div><div class="metric-value">${moeda(r.precoAno)}/kg</div></div></div></div>`}).join('');

/* === V26.5.2 - Validações Inteligentes de Entrada de Dados === */
function valorNumericoPositivo(valor, nomeCampo){
    const n=Number(valor);
    if(!Number.isFinite(n) || n<=0){alert(`${nomeCampo} deve ser maior que zero.`);return null;}
    return n;
}
function dataEhFutura(dataISO){
    if(!dataISO)return false;
    const hoje=new Date(); hoje.setHours(0,0,0,0);
    const d=getDate(dataISO); return d && d>hoje;
}
function confirmarDataFutura(dataISO, contexto){
    if(dataEhFutura(dataISO))return confirm(`${contexto} está com data futura (${formatarDataBR(dataISO)}). Deseja continuar mesmo assim?`);
    return true;
}
function confirmarValorForaPadrao(valor, limite, contexto){
    const n=Number(valor)||0;
    if(n>limite)return confirm(`${contexto} está acima do padrão esperado (${moeda(n)}). Confirma o lançamento?`);
    return true;
}
function confirmarQuantidadeForaPadrao(qtd, limite, contexto){
    const n=Number(qtd)||0;
    if(n>limite)return confirm(`${contexto} está acima do padrão esperado (${num(n)} kg). Confirma o lançamento?`);
    return true;
}
function materialAtivoPorNome(nome){
    return (db.materiais||[]).find(m=>String(m.nome||'')===String(nome||'') && registroAtivo(m));
}
function materialExistentePorNome(nome){
    return (db.materiais||[]).find(m=>String(m.nome||'').toUpperCase()===String(nome||'').toUpperCase());
}
function validarEmailSimples(email){
    if(!email)return true;
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}
function somenteDigitos(txt){return String(txt||'').replace(/\D/g,'')}

    const baseProducao = (typeof producoesAtivas==='function'?producoesAtivas():(db.producao||[]).filter(registroAtivo));
    const baseVendas = (typeof vendasAtivas==='function'?vendasAtivas():(db.vendas||[]).filter(registroAtivo));
    let prod=baseProducao.filter(p=>dataDentroPeriodo(p.data,di,df,mes,ano)&&p.tipo!=='Rejeito');
    let vendas=baseVendas.filter(v=>dataDentroPeriodo(v.data,di,df,mes,ano));
    function categoriaDe(material, fallback=''){
        let m=(db.materiais||[]).find(x=>x.nome===material)||{};
        return fallback||m.categoria||'';
    }
    prod=prod.filter(p=>(!cat||(p.categoria||categoriaDe(p.material))===cat)&&(!mat||p.material===mat));
    vendas=vendas.filter(v=>{let c=v.categoria||categoriaDe(v.material); return (!cat||c===cat)&&(!mat||v.material===mat)});
    let prodTotal=prod.reduce((a,p)=>a+Number(p.quantidade||0),0);
    let vendidoTotal=vendas.reduce((a,v)=>a+Number(v.quantidade||0),0);
    let faturamento=vendas.reduce((a,v)=>a+Number(v.total||0),0);
    let precoMedio=vendidoTotal?faturamento/vendidoTotal:0;
    let estoqueFiltrado=(typeof calcularEstoque==='function'?calcularEstoque():[]).filter(e=>{let c=categoriaDe(e.material); return (!cat||c===cat)&&(!mat||e.material===mat)});
    let estoqueAtual=estoqueFiltrado.reduce((a,e)=>a+Number(e.saldo||0),0);
    let materiaisComercializados=new Set(vendas.map(v=>v.material)).size;
    let porCategoria={}, porMaterialProd={}, vendasMaterial={}, compradores={};
    prod.forEach(p=>{
        let c=p.categoria||categoriaDe(p.material);
        porCategoria[c]=(porCategoria[c]||0)+Number(p.quantidade||0);
        porMaterialProd[p.material]=(porMaterialProd[p.material]||0)+Number(p.quantidade||0);
    });
    vendas.forEach(v=>{
        if(!vendasMaterial[v.material])vendasMaterial[v.material]={qtd:0,total:0,min:null,max:null,precos:[]};
        let vm=vendasMaterial[v.material],q=Number(v.quantidade||0),t=Number(v.total||0),pu=Number(v.precoUnit||0);
        vm.qtd+=q; vm.total+=t;
        if(pu>0){vm.min=vm.min===null?pu:Math.min(vm.min,pu); vm.max=vm.max===null?pu:Math.max(vm.max,pu); vm.precos.push(pu)}
        let comp=v.comprador||'Não informado', chave=`${comp}|||${v.material}`;
        if(!compradores[chave])compradores[chave]={comprador:comp,material:v.material,qtd:0,total:0};
        compradores[chave].qtd+=q; compradores[chave].total+=t;
    });
    let arrCategoria=Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]);
    let arrProdMaterial=Object.entries(porMaterialProd).sort((a,b)=>b[1]-a[1]);
    let arrVendaMaterial=Object.entries(vendasMaterial).map(([material,o])=>({material,...o,medio:o.qtd?o.total/o.qtd:0})).sort((a,b)=>b.total-a.total);
    let arrCompradores=Object.values(compradores).sort((a,b)=>b.total-a.total);
    return {mes,ano,di,df,cat,mat,periodo:periodoRelatorioTexto(di,df,mes,ano),prodTotal,vendidoTotal,faturamento,precoMedio,estoqueAtual,materiaisComercializados,arrCategoria,arrProdMaterial,arrVendaMaterial,arrCompradores};
}

/* ===== V26.5.5 - Auditoria e Evolução do Módulo Frequência ===== */
const MOTIVOS_AUSENCIA_V2654=['Falta','Atestado','Férias','Licença','Capacitação','Outro'];

function frequenciasAtivas(){
    return (db.frequencia||[]).filter(registroAtivo);
}
function frequenciasCanceladas(){
    return (db.frequencia||[]).filter(registroCancelado);
}
function motivoAusenciaLabel(m){
    return MOTIVOS_AUSENCIA_V2654.includes(m)?m:'Falta';
}
function normalizarFrequenciaBase(){
    if(!Array.isArray(db.frequencia))db.frequencia=[];
    const vistos=new Set();
    db.frequencia.forEach(f=>{
        prepararAuditoriaRegistro(f);
        if(!f.status)f.status='N';
        if(f.status==='A'&&!f.motivoAusencia)f.motivoAusencia='Falta';
        if(f.observacao===undefined)f.observacao='';
        const chave=String(f.cooperadoId)+'|'+String(f.data);
        if(registroAtivo(f)){
            if(vistos.has(chave)){
                f.statusRegistro='CANCELADO';
                f.canceladoEm=f.canceladoEm||agoraISO();
                f.canceladoPor=f.canceladoPor||'Sistema';
                f.motivoCancelamento=f.motivoCancelamento||'Duplicidade de frequência normalizada automaticamente na V26.5.5';
                f.alteradoEm=f.canceladoEm;
            }else{
                vistos.add(chave);
            }
        }
    });
}
function getFreqRegistro(coopId,data){
    return (db.frequencia||[]).find(f=>String(f.cooperadoId)===String(coopId)&&String(f.data)===String(data)&&registroAtivo(f));
}
function freqStatusTexto(st){
    if(st==='P')return 'Presença';
    if(st==='A')return 'Ausência';
    return 'Sem informação';
}
function freqResumoCancelamento(reg){
    let coop=(db.cooperados||[]).find(c=>String(c.id)===String(reg.cooperadoId));
    return `Frequência\nCooperado: ${coop?coop.nome:'Não identificado'}\nData: ${formatarDataBR(reg.data)}\nStatus: ${freqStatusTexto(reg.status)}${reg.status==='A'?`\nMotivo: ${reg.motivoAusencia||'Falta'}`:''}`;
}
function cancelarFrequencia(id){
    const reg=(db.frequencia||[]).find(f=>String(f.id)===String(id));
    if(!reg)return alert('Registro de frequência não encontrado.');
    if(registroCancelado(reg))return alert('Este registro já está cancelado.');
    const resumo=freqResumoCancelamento(reg);
    let responsavel=prompt(`${resumo}\n\nInforme quem está cancelando este registro de frequência:`);
    if(responsavel===null)return;
    responsavel=String(responsavel).trim();
    if(!responsavel)return alert('Informe o responsável pelo cancelamento.');
    let motivo=prompt(`${resumo}\n\nInforme o motivo do cancelamento:`);
    if(motivo===null)return;
    motivo=String(motivo).trim();
    if(!motivo)return alert('Informe o motivo do cancelamento.');
    if(!confirm(`${resumo}\n\nConfirmar cancelamento?\n\nResponsável: ${responsavel}\nMotivo: ${motivo}\n\nO registro continuará salvo para auditoria.`))return;
    prepararAuditoriaRegistro(reg);
    reg.statusRegistro='CANCELADO';
    reg.canceladoEm=agoraISO();
    reg.canceladoPor=responsavel;
    reg.motivoCancelamento=motivo;
    reg.alteradoEm=reg.canceladoEm;
    reg.versaoRegistro=VERSAO_REGISTRO_AUDITORIA;
    salvarDB();
    carregarFrequencia();
}
function setFrequencia(coopId,data,status,motivoAusencia='',observacao=''){
    normalizarFrequenciaBase();
    let reg=getFreqRegistro(coopId,data);
    if(!reg){
        reg={id:Date.now()+Math.random(),cooperadoId:coopId,data};
        prepararAuditoriaRegistro(reg);
        db.frequencia.push(reg);
    }
    reg.status=status||'N';
    if(reg.status==='A'){
        reg.motivoAusencia=motivoAusencia||reg.motivoAusencia||'Falta';
    }else{
        reg.motivoAusencia='';
    }
    if(observacao!==undefined)reg.observacao=observacao||reg.observacao||'';
    reg.alteradoEm=agoraISO();
    reg.versaoRegistro=VERSAO_REGISTRO_AUDITORIA;
    salvarDB();
    carregarFrequencia();
}
function alterarMotivoFrequencia(coopId,data,motivo){
    let reg=getFreqRegistro(coopId,data);
    if(!reg)return;
    reg.status='A';
    reg.motivoAusencia=motivoAusenciaLabel(motivo);
    reg.alteradoEm=agoraISO();
    salvarDB();
    carregarFrequencia();
}
function editarObservacaoFrequencia(coopId,data){
    let reg=getFreqRegistro(coopId,data);
    if(!reg){
        alert('Selecione uma presença ou ausência antes de registrar observação.');
        return;
    }
    let obs=prompt('Observação da frequência:',reg.observacao||'');

    salvarDB();
    carregarFrequencia();
}
function contarFaltas(mes,ano){
    return frequenciasAtivas().filter(f=>mesmoMesAno(f.data,mes,ano)&&f.status==='A').length;
}
function contarAusenciasPorMotivo(mes,ano){
    const obj={Falta:0,Atestado:0,Férias:0,Licença:0,Capacitação:0,Outro:0};
    frequenciasAtivas().filter(f=>mesmoMesAno(f.data,mes,ano)&&f.status==='A').forEach(f=>{
        const m=motivoAusenciaLabel(f.motivoAusencia);
        obj[m]=(obj[m]||0)+1;
    });
    return obj;
}
function freqMedia(mes,ano){
    let regs=frequenciasAtivas().filter(f=>mesmoMesAno(f.data,mes,ano)&&(f.status==='P'||f.status==='A'));
    if(!regs.length)return 0;
    let pres=regs.filter(f=>f.status==='P').length;
    return pres/regs.length*100;
}
function diasPerdidosFrequencia(mes,ano){
    return frequenciasAtivas().filter(f=>mesmoMesAno(f.data,mes,ano)&&f.status==='A'&&['Falta','Atestado','Licença'].includes(motivoAusenciaLabel(f.motivoAusencia))).length;

function metricasFrequenciaHoje(){
    const hoje=hojeISO();

    const presentes=regs.filter(f=>f.status==='P').length;
    const ausentes=regs.filter(f=>f.status==='A').length;

    return {presentes,ausentes,ferias:motivos['Férias']||0,atestados:motivos['Atestado']||0};
}

function dadosPeriodoGestao(mes,ano){

        return mesmoMesAno(dataBase,mes,ano);

    let despPagas=despesas.filter(d=>d.situacao==='Pago');
    let r=resumoProducao(producao);
    let faturamento=vendas.reduce((a,v)=>a+(Number(v.total)||0),0);

    let semAcidente=diasSemAcidente();

    return {faturamento,custos,resultado,producao:r.total,rejeito:r.rejeito,eficiencia:r.eficiencia,volumeVendido,ativos,faltas,freq,acidentes,afastados,diasPerdidos:diasPerdidosOcorrencias+diasPerdidosFreq,semAcidente,retirada,presentesHoje:hojeM.presentes,ausentesHoje:hojeM.ausentes,ferias:motivos['Férias']||0,atestados:motivos['Atestado']||0,licencas:motivos['Licença']||0,capacitacoes:motivos['Capacitação']||0};

        cardVista('🗑️','Rejeito',num(d.rejeito)+' kg',metaValor('rejeito')?num(metaValor('rejeito'))+' kg':'Sem meta',statusMeta(d.rejeito,metaValor('rejeito'),'menorMelhor')),
        cardVista('⚙️','Eficiência da triagem',num(d.eficiencia,1)+'%','Quanto maior, melhor',statusMeta(d.eficiencia,80))
    ])+
    bloco('👥 Pessoas',[
        cardVista('👥','Cooperados ativos',String(d.ativos),'Cadastro de cooperados',statusMeta(d.ativos,1)),
        cardVista('📅','Frequência média',num(d.freq,1)+'%',metaValor('frequencia')?num(metaValor('frequencia'),1)+'%':'90%',statusMeta(d.freq,metaValor('frequencia',90))),
        cardVista('❌','Faltas no mês',String(d.faltas),'Quanto menor, melhor',statusMeta(d.faltas,0,'menorMelhor'))
    ])+
    bloco('🚑 Segurança e Saúde',[
        cardVista('🚑','Ocorrências do mês',String(d.acidentes),metaValor('acidentes')?String(metaValor('acidentes')):'0',statusMeta(d.acidentes,metaValor('acidentes',0),'menorMelhor')),
        cardVista('🏥','Cooperados afastados',String(d.afastados),'0',statusMeta(d.afastados,0,'menorMelhor')),
        cardVista('📅','Dias perdidos',String(d.diasPerdidos)+' dias','Quanto menor, melhor',statusMeta(d.diasPerdidos,0,'menorMelhor'))
    ])+
    bloco('📊 Desempenho',[
        cardVista('🟢','Dias sem acidente',d.semAcidente===null?'Sem registro':String(d.semAcidente)+' dias','Quanto maior, melhor',d.semAcidente===null?statusMeta(0,0):statusMeta(d.semAcidente,30)),
        cardVista('💵','Retirada média',moeda(d.retirada),metaValor('retirada')?moeda(metaValor('retirada')):'Sem meta',statusMeta(d.retirada,metaValor('retirada')))
    ]);
    gvPainel.innerHTML=html;
}

</script>
